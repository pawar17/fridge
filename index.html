<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}body{margin:0;font:14px system-ui,sans-serif;background:#fffdf2}@media (prefers-color-scheme: dark){body{background:#15130e}}img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fridge"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffdf2"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#221f17"></head><body>
<title>What's In My Fridge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: a soft-shaded pastel fridge standing in a lilac kitchen. Doors bounce open onto glass shelves of little food; glossy magnets are dragged around the door and tapped to open paper-like sheets; a dock under the fridge logs your usual meal. */
:root{
  --wall-1:#fffdf2; --wall-2:#fff6d4; --wall-glow:rgba(255,255,255,0); --floor-1:#f3e6c9; --floor-2:#e6d3ab; --btn-bg:#1d1d1f; --btn-fg:#ffffff;
  --fr-hi:#fbfcfd; --fr-1:#e3e7eb; --fr-2:#cbd1d7; --fr-3:#a3abb3; --fr-seam:#8b949c; --chrome-1:#ffffff; --chrome-2:#b9c1c8; --chrome-3:#7f8990;
  --in-1:#fffdf6; --in-2:#eef6f4; --in-wall:#e3efec; --glass-1:rgba(255,255,255,.95); --glass-2:rgba(170,215,225,.55); --liner:#e7f2ef;
  --ink:#2c2838; --ink-2:#6f6a7c; --line:#e7e2ee; --soft:#f4f1f8; --field:#ffffff; --sheet:#fffdfb; --tile:#ffffff; --paper:#fffdf7;
  --accent:#ff7a6b; --accent-soft:#ffe5e0;
  --m-tomato:#ff7a6b; --m-butter:#ffd36e; --m-sky:#8cc8ff; --m-lilac:#b9a4ff; --m-pink:#ff9ec4; --m-peach:#ffb38a; --m-mint:#6fd6b4;
  --c-red:#ffe1dc; --c-red-i:#d9483b; --c-amber:#fff0cc; --c-amber-i:#b37400; --c-green:#dcf5e8; --c-green-i:#1f8a52;
  --c-blue:#e1efff; --c-blue-i:#2f6fc0; --c-violet:#eee8ff; --c-violet-i:#6a4fc9; --c-pink:#ffe6f0; --c-pink-i:#c2457a;
  --ok:#2fb36d; --warn:#f0a020; --bad:#f0584a;
  --shadow:rgba(60,40,90,.22); --shadow-2:rgba(60,40,90,.08);
  --f: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall-1:#221f17; --wall-2:#15130e; --wall-glow:rgba(255,214,110,.13); --floor-1:#2a2519; --floor-2:#1c1912; --btn-bg:#f5f5f7; --btn-fg:#1d1d1f;
  --fr-hi:#b9c0c7; --fr-1:#979fa7; --fr-2:#7d858d; --fr-3:#61686f; --fr-seam:#474d53; --chrome-1:#f2f4f6; --chrome-2:#aeb7be; --chrome-3:#6f7980;
  --ink:#f1eef7; --ink-2:#b0aac0; --line:#3a3548; --soft:#2d2939; --field:#1f1c29; --sheet:#1f1c29; --tile:#2a2636;
  --accent:#ff8a7c; --accent-soft:#4a2a2a;
  --c-red:#4a2522; --c-red-i:#ff9c8e; --c-amber:#46371a; --c-amber-i:#ffc95c; --c-green:#1a3d2b; --c-green-i:#6fdca0;
  --c-blue:#1c3350; --c-blue-i:#8fbdf7; --c-violet:#302852; --c-violet-i:#bfaeff; --c-pink:#4a2438; --c-pink-i:#ff9dc6;
  --shadow:rgba(0,0,0,.5); --shadow-2:rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --wall-1:#221f17; --wall-2:#15130e; --wall-glow:rgba(255,214,110,.13); --floor-1:#2a2519; --floor-2:#1c1912; --btn-bg:#f5f5f7; --btn-fg:#1d1d1f;
  --fr-hi:#b9c0c7; --fr-1:#979fa7; --fr-2:#7d858d; --fr-3:#61686f; --fr-seam:#474d53; --chrome-1:#f2f4f6; --chrome-2:#aeb7be; --chrome-3:#6f7980;
  --ink:#f1eef7; --ink-2:#b0aac0; --line:#3a3548; --soft:#2d2939; --field:#1f1c29; --sheet:#1f1c29; --tile:#2a2636;
  --accent:#ff8a7c; --accent-soft:#4a2a2a;
  --c-red:#4a2522; --c-red-i:#ff9c8e; --c-amber:#46371a; --c-amber-i:#ffc95c; --c-green:#1a3d2b; --c-green-i:#6fdca0;
  --c-blue:#1c3350; --c-blue-i:#8fbdf7; --c-violet:#302852; --c-violet-i:#bfaeff; --c-pink:#4a2438; --c-pink-i:#ff9dc6;
  --shadow:rgba(0,0,0,.5); --shadow-2:rgba(0,0,0,.25); color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 130% 55% at 50% 0%,var(--wall-glow),transparent 70%),linear-gradient(180deg,var(--wall-1),var(--wall-2) 80%);background-color:var(--wall-2);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;position:relative;overflow:hidden;box-sizing:border-box}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 0;gap:8px}
.topbar h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.topbar .sub{font-size:13px;color:var(--ink-2);font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--tile);box-shadow:0 2px 0 var(--shadow-2),0 6px 12px -6px var(--shadow);display:grid;place-items:center;color:var(--ink)}

/* top of fridge */
.fridge-top{height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding-inline:18px}
.basket{border:0;background:none;padding:0;display:flex;align-items:flex-end;gap:6px;transform-origin:bottom center}
.basket:active{transform:scale(.96)}
.basket-body{position:relative;width:78px;height:30px;border-radius:5px 5px 16px 16px;background:repeating-linear-gradient(90deg,#d99a5c 0 7px,#c5854a 7px 9px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.08)}
.basket-body::before{content:"";position:absolute;left:12px;right:12px;top:-15px;height:20px;border:4px solid #b97a40;border-bottom:0;border-radius:30px 30px 0 0}
.basket-body i{position:absolute;top:-16px;font-size:20px;font-style:normal;filter:drop-shadow(0 2px 1px rgba(0,0,0,.15))}
.basket-count{background:var(--tile);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;margin-bottom:4px;box-shadow:0 2px 0 var(--shadow-2)}
.plant{font-size:32px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}

/* fridge body */
.fridge-wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;margin-top:14px}
.fridge{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;padding:0;border-radius:30px 30px 18px 18px;background:linear-gradient(90deg,var(--fr-3) 0,var(--fr-2) 4%,var(--fr-1) 14%,var(--fr-hi) 30%,var(--fr-1) 55%,var(--fr-2) 88%,var(--fr-3) 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -6px 0 rgba(0,0,0,.08),0 22px 30px -18px var(--shadow);position:relative;z-index:1}
.fridge.thunk{animation:thunk .35s ease-out}
@keyframes thunk{0%{transform:translateY(0)}30%{transform:translateY(2px) scaleY(.995)}60%{transform:translateY(-1px)}100%{transform:none}}
.feet{height:10px;display:flex;justify-content:space-between;padding-inline:34px;position:relative;z-index:0}
.feet i{width:22px;height:8px;border-radius:0 0 6px 6px;background:var(--fr-seam);display:block}
.floor{height:34px;margin-inline:-16px;background:linear-gradient(180deg,var(--floor-1),var(--floor-2));position:relative;margin-top:-4px}
.floor::before{content:"";position:absolute;left:12%;right:12%;top:0;height:14px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(40,30,50,.22),transparent 70%)}
.comp{position:relative;perspective:1400px;perspective-origin:20% 50%;min-height:0}
.comp.freezer{flex:0 0 23%;border-bottom:4px solid var(--fr-seam)}
.comp.main{flex:1}
.comp.freezer .door,.comp.freezer .inside{border-radius:30px 30px 6px 6px}
.comp.main .door,.comp.main .inside{border-radius:6px 6px 18px 18px}
.inside{position:absolute;inset:6px;border-radius:inherit;background:linear-gradient(180deg,var(--in-1),var(--in-2));box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 7px rgba(0,0,0,.06),inset 0 14px 30px rgba(0,0,0,.12);overflow-y:auto;overscroll-behavior:contain;visibility:hidden}
.comp.open .inside,.comp.opening .inside,.comp.closing .inside{visibility:visible}
.inside::after{content:"";position:sticky;top:0;display:block;height:0}
.glow{position:absolute;inset:6px;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse at 50% 0,rgba(255,244,190,.85),transparent 60%);opacity:0;z-index:1}
.comp.open .glow{animation:flicker .7s ease-out forwards}
@keyframes flicker{0%{opacity:0}15%{opacity:1}25%{opacity:.3}40%{opacity:1}100%{opacity:.75}}
.door{position:absolute;inset:0;transform-origin:right center;transform-style:preserve-3d;z-index:3}
.comp.open .door{animation:doorOpen .95s cubic-bezier(.3,.6,.3,1) forwards;pointer-events:none}
.comp.closing .door{animation:doorClose .55s cubic-bezier(.5,0,.6,1) forwards}
@keyframes doorOpen{0%{transform:rotateY(0)}55%{transform:rotateY(120deg)}75%{transform:rotateY(98deg)}90%{transform:rotateY(109deg)}100%{transform:rotateY(105deg)}}
@keyframes doorClose{0%{transform:rotateY(105deg)}78%{transform:rotateY(-3deg)}90%{transform:rotateY(1.5deg)}100%{transform:rotateY(0)}}
.face{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px,transparent 2px 4px),linear-gradient(115deg,transparent 20%,rgba(255,255,255,.35) 30%,transparent 42%,transparent 62%,rgba(255,255,255,.18) 70%,transparent 78%),linear-gradient(90deg,var(--fr-2) 0,var(--fr-1) 10%,var(--fr-hi) 32%,var(--fr-1) 58%,var(--fr-2) 94%,var(--fr-3) 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.07);container-type:size}
.face.front::after{content:"";position:absolute;top:0;bottom:0;left:24%;width:9%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);pointer-events:none;border-radius:inherit}
.face.back{transform:rotateY(180deg);background:var(--liner);box-shadow:inset 0 0 0 6px #fff}
.handle{position:absolute;left:12px;width:14px;border:0;border-radius:8px;padding:0;z-index:5;background:linear-gradient(90deg,var(--chrome-1),var(--chrome-2) 55%,var(--chrome-3));box-shadow:2px 3px 5px rgba(0,0,0,.18),inset 0 1px 0 #fff}
.handle::before,.handle::after{content:"";position:absolute;left:3px;width:8px;height:8px;border-radius:2px;background:var(--chrome-3)}
.handle::before{top:-5px}.handle::after{bottom:-5px}
.handle:active{transform:translateX(2px)}
.h-freezer{bottom:16px;height:42%}
.h-main{top:16px;height:24%}
.hit{position:absolute;inset:-10px -14px}

/* magnets */
.magnet{position:absolute;touch-action:none;cursor:grab;z-index:2;transition:transform .25s cubic-bezier(.3,1.6,.5,1),filter .2s;transform:rotate(var(--r,0deg));filter:drop-shadow(0 7px 7px var(--shadow)) drop-shadow(0 2px 1px rgba(0,0,0,.12))}
.magnet:active{cursor:grabbing}
.magnet.dragging{transform:rotate(0deg) scale(1.08);filter:drop-shadow(0 18px 16px var(--shadow));z-index:10;transition:filter .2s}
.magnet.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:rotate(var(--r)) scale(1)}40%{transform:rotate(0) scale(1.12)}100%{transform:rotate(var(--r)) scale(1)}}
.gloss{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.85) 0 7%,rgba(255,255,255,.25) 22%,transparent 45%),linear-gradient(165deg,color-mix(in srgb,var(--mc) 70%,#fff),var(--mc) 55%,color-mix(in srgb,var(--mc) 80%,#000));box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.6)}
.pin{position:absolute;top:-10px;left:50%;margin-left:-12px;width:24px;height:24px;border-radius:50%;z-index:2}
.paper{background:var(--paper);color:#2c2838;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.paper.lined{background:linear-gradient(var(--paper) 0 26px,transparent 26px) ,repeating-linear-gradient(180deg,var(--paper) 0 21px,#dfe8f7 21px 22px)}
.m-title{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#8a8398}

#mag-eat{width:45cqw;height:42cqh;--r:-2deg;padding:16px 11px 9px;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;overflow:visible}
#mag-eat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
#mag-eat li{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;min-width:0}
#mag-eat li .e{font-size:16px;flex:none}
#mag-eat li .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mag-eat li .d{font-size:11px;font-weight:900;flex:none}
#mag-eat .foot{margin-top:auto;font-size:11.5px;font-weight:700;color:#8a8398}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.t-bad{color:var(--bad)} .t-warn{color:var(--warn)} .t-ok{color:var(--ok)}
.bg-bad{background:var(--bad)} .bg-warn{background:var(--warn)} .bg-ok{background:var(--ok)}

#mag-cal{--mc:var(--m-butter);--r:4deg;width:min(36cqw,27cqh);height:min(36cqw,27cqh);border-radius:50%;display:grid;place-items:center;color:#3a2f10}
#mag-cal svg{position:absolute;inset:10%;width:80%;height:80%}
#mag-cal .ring-bg{fill:none;stroke:rgba(255,255,255,.55)} #mag-cal .ring-fg{fill:none;stroke:#e0663b;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,1.3,.5,1)}
#mag-cal .ring-fg.over{stroke:var(--bad)}
#mag-cal .c-txt{position:relative;text-align:center;line-height:1.05}
#mag-cal b{display:block;font-size:clamp(17px,6cqw,24px);font-weight:900;font-variant-numeric:tabular-nums}
#mag-cal small{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;opacity:.75}

#mag-habits{width:39cqw;height:29cqh;--r:2deg;padding:14px 10px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;overflow:visible}
.hrow{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;min-width:0}
.hrow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow small{font-size:11px;color:#8a8398;font-variant-numeric:tabular-nums;font-weight:800}
.chk{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid #b8b0c8;background:#fff;display:grid;place-items:center;padding:0;color:#fff;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.chk svg.i{width:13px;height:13px;stroke-width:3.2}
.chk.on{background:var(--ok);border-color:var(--ok);transform:scale(1.08)}
.chk.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{50%{transform:scale(1.35)}}

.badge{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:28%;text-align:center;gap:2px;color:#2c2838}
.badge .emo{font-size:clamp(26px,10cqw,38px);line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.badge b{font-size:11.5px;font-weight:900;letter-spacing:.02em;line-height:1.1}
.badge small{font-size:10px;font-weight:800;opacity:.75;line-height:1.1}
#mag-cook{--mc:var(--m-peach);--r:0deg;width:min(26cqw,20cqh);height:min(26cqw,20cqh)}
#mag-scan{--mc:var(--m-sky);--r:0deg;width:min(26cqw,20cqh);height:min(26cqw,20cqh)}
#mag-shop{width:39cqw;height:28cqh;--r:-2.5deg;padding:15px 10px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;overflow:visible;background:#ffe3ee}
#mag-shop ul{list-style:none;margin:0;padding:0;font-size:13px;font-weight:700;line-height:1.35;min-height:0;overflow:hidden}
#mag-shop li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mag-shop li::before{content:"○ ";color:#c07a98}
#mag-shop .m-title{color:#b0628a}
.cam{position:relative;width:60%;aspect-ratio:1.45;background:#fff;border-radius:18%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.cam::before{content:"";position:absolute;left:50%;top:52%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 34%,#9ab 0 12%,#1d2433 16% 44%,#56627a 48% 58%,#2c2838 62%)}
.cam::after{content:"";position:absolute;right:10%;top:12%;width:14%;height:12%;border-radius:3px;background:var(--m-tomato)}

#mag-score{--mc:var(--m-mint);--r:-6deg;width:min(26cqw,70cqh);height:min(26cqw,70cqh);border-radius:50%;color:#10392b}
#mag-score b{font-size:clamp(18px,6cqw,24px);font-weight:900;letter-spacing:-.01em}
#mag-lab{--mc:var(--m-lilac);--r:4deg;width:min(24cqw,62cqh);height:min(24cqw,62cqh);color:#2a1d5c}
.letters{position:absolute;left:44px;top:50%;transform:translateY(-50%);display:flex;gap:2px;pointer-events:none}
.letters span{font-size:clamp(20px,7.5cqw,30px);font-weight:900;color:var(--lc);text-shadow:0 1px 0 rgba(255,255,255,.6),0 3px 0 rgba(0,0,0,.18);transform:rotate(var(--lr))}

.hint-bubble{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--sheet);font-size:13px;font-weight:700;padding:10px 14px;border-radius:14px;text-align:center;box-shadow:0 10px 20px var(--shadow);max-width:80%;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translate(-50%,-56%)}}

/* inside: shelves and food */
.in-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:14px 14px 6px;background:linear-gradient(var(--in-1) 70%,transparent)}
.in-head h2{margin:0;font-size:18px;font-weight:900;flex:1;color:#2c2838}
.in-head h2 small{font-size:12.5px;font-weight:700;color:#8a8398;margin-left:6px}
.swipe-hint{padding:0 14px 4px;font-size:12px;font-weight:700;color:#8a8398;display:flex;gap:14px}
.swipe-hint b{color:var(--ok)} .swipe-hint i{font-style:normal;color:var(--bad);font-weight:800}
.shelf{position:relative;padding:18px 10px 12px;margin:0 6px}
.shelf::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:9px;border-radius:3px;background:linear-gradient(180deg,var(--glass-1),var(--glass-2));box-shadow:0 4px 6px rgba(80,120,140,.18),inset 0 1px 0 #fff}
.shelf-tag{position:absolute;top:2px;left:10px;font-size:10.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#9c96aa}
.shelf.drawer{margin:10px 12px 12px;padding:18px 8px 10px;border-radius:10px 10px 18px 18px;background:linear-gradient(180deg,rgba(190,235,220,.25),rgba(160,215,200,.45));box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),inset 0 -8px 0 rgba(120,190,170,.25)}
.shelf.drawer::after{display:none}
.shelf.doorbin{margin:4px 12px 12px;padding:18px 8px 8px;border-radius:6px 6px 14px 14px;background:linear-gradient(180deg,transparent 40%,rgba(200,225,235,.45) 40%);}
.shelf.doorbin::after{display:none}
.row-food{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 2px;min-height:62px}
.food3d{position:relative;width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:2px 0;touch-action:pan-y;color:#2c2838;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .25s}
.food3d .fe{font-size:31px;line-height:1.05;filter:drop-shadow(0 4px 2px rgba(0,0,0,.18));transition:transform .2s}
.food3d .fn{max-width:60px;font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.food3d .fd{font-size:9.5px;font-weight:900;border-radius:999px;padding:1px 6px;line-height:1.3}
.fd.ok{background:#dcf5e8;color:#1f8a52} .fd.warn{background:#fff0cc;color:#a86a00} .fd.bad{background:#ffe1dc;color:#d9483b} .fd.muted{background:#efedf3;color:#8a8398}
.food3d .qty{position:absolute;top:0;right:6px;background:#2c2838;color:#fff;font-size:9.5px;font-weight:900;border-radius:999px;padding:0 5px;line-height:1.5}
.food3d.soon .fe{animation:wiggle 2.6s ease-in-out infinite}
.food3d.gone .fe{filter:grayscale(.5) drop-shadow(0 4px 2px rgba(0,0,0,.18));opacity:.8}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-9deg)}88%{transform:rotate(8deg)}92%{transform:rotate(-5deg)}96%{transform:rotate(3deg)}}
.food3d:active .fe{transform:scale(1.12)}
.food3d.swiping{transition:none;z-index:4}
.food3d[data-dir]::before{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;white-space:nowrap;color:#fff}
.food3d[data-dir="ate"]::before{content:"Ate it";background:var(--ok)}
.food3d[data-dir="toss"]::before{content:"Tossed";background:var(--bad)}
.empty-shelf{font-size:12.5px;color:#9c96aa;font-weight:700;align-self:center;padding:0 6px}
.banner{margin:2px 12px 6px;padding:9px 12px;border-radius:14px;background:#fff3cc;color:#5a4610;font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner button{border:0;background:none;text-decoration:underline;font-weight:900;padding:0;color:inherit}

/* dock */
.dock{display:flex;flex-direction:column;gap:8px;padding:10px 0 12px;position:relative;z-index:2}
.dock-row{display:flex;gap:8px;align-items:stretch;min-width:0}
.usual{flex:1;min-width:0;border:0;border-radius:20px;background:var(--tile);padding:9px 10px 9px 12px;text-align:left;box-shadow:0 3px 0 var(--shadow-2),0 8px 16px -10px var(--shadow);display:flex;align-items:center;gap:10px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.usual:active{transform:scale(.97)}
.usual .u-e{font-size:24px;flex:none}
.usual .u-txt{flex:1;min-width:0}
.usual small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:700}
.usual b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usual .u-k{font-size:12.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.usual .u-plus{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.log-btn{border:0;border-radius:16px;background:var(--btn-bg);color:var(--btn-fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:16px;letter-spacing:-.01em;padding:0 20px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .15s ease,opacity .15s;box-shadow:0 6px 14px -8px rgba(0,0,0,.45)}
.log-btn:active{transform:scale(.95)}
.log-btn svg.i{stroke-width:2.2;width:16px;height:16px}

/* controls */
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;font-size:14.5px;background:var(--ink);color:var(--sheet);display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff}
.btn.good{background:var(--ok);color:#fff}
.btn.danger{background:var(--c-red);color:var(--c-red-i)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.inp{box-sizing:border-box;width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--field);font:inherit;color:var(--ink);min-width:0}
.inp:focus{outline:none;border-color:var(--accent)}
select.inp{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
label.lbl{display:block;font-size:12.5px;font-weight:800;color:var(--ink-2);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink-2)} .tiny{font-size:12.5px}
.section-t{font-size:13px;font-weight:800;color:var(--ink-2);margin:4px 0 -4px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(30,20,45,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,460px);max-height:92%;transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.25,1.25,.4,1);z-index:20;background:var(--sheet);border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px var(--shadow);color:var(--ink);box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:translate(-50%,0)}
.sh-head{display:flex;align-items:center;gap:10px;padding:20px 18px 12px;position:relative}
.sh-head::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:5px;background:var(--line)}
.sh-emo{font-size:26px;line-height:1}
.sh-head h2{margin:0;flex:1;font-size:21px;font-weight:900;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.close-x{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;color:var(--ink-2)}
.sh-body{overflow:auto;padding:2px 18px 26px;overscroll-behavior:contain}
.card{background:var(--soft);border-radius:16px;padding:12px 14px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px 4px;font-weight:800;font-size:13px;color:var(--ink-2);transition:background .2s}
.seg button.on{background:var(--tile);color:var(--ink);box-shadow:0 2px 6px var(--shadow-2)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:18px;padding:20px 12px;text-align:center;cursor:pointer;color:var(--ink)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop svg.i{width:30px;height:30px;color:var(--accent)}
.preview{width:100%;max-height:200px;object-fit:contain;border-radius:16px;background:var(--soft)}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.err{background:var(--c-red);color:var(--c-red-i);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700}
.note-box{background:var(--c-amber);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:600}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1.5px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:800;font-size:14.5px;overflow-wrap:anywhere}
.li .main small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600}
.li .num{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.sugg-btn{width:100%;border:0;background:none;padding:0;text-align:left;display:flex;align-items:center;gap:10px}
.sugg-btn:active .add-circle{transform:scale(1.2)}
.add-circle{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:transform .2s cubic-bezier(.3,1.8,.5,1),background .2s}
.add-circle svg.i{stroke-width:3}
.add-circle.done{background:var(--ok)}
.x-btn{border:0;background:var(--soft);width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ink-2)}
.x-btn svg.i{width:13px;height:13px}
.why-tag{display:inline-block;font-size:11.5px;font-weight:800;color:var(--c-violet-i);background:var(--c-violet);border-radius:999px;padding:1px 8px;margin-right:4px}

.parse-row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:10px 0;border-bottom:1.5px solid var(--line)}
.parse-row .fields{display:grid;grid-template-columns:1fr 64px;gap:6px;min-width:0}
.parse-row .sub{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;grid-column:1 / -1}
.parse-row .inp{padding:8px 9px;font-size:14px;border-radius:11px}
.parse-row.off .fields{opacity:.4}
.tick{width:22px;height:22px;margin-top:7px;accent-color:var(--ok)}
.mini-lbl{font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:2px}

.item-hero{display:flex;align-items:center;gap:12px}
.item-hero .emo{width:60px;height:60px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:34px;flex:none}
.pill{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.ok{background:var(--c-green);color:var(--c-green-i)} .pill.warn{background:var(--c-amber);color:var(--c-amber-i)} .pill.bad{background:var(--c-red);color:var(--c-red-i)} .pill.muted{background:var(--soft);color:var(--ink-2)}
.timeline{display:flex;align-items:center;margin:8px 0 4px}
.tl-pt{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;font-size:11.5px;color:var(--ink-2);text-align:center;width:66px;font-weight:700}
.tl-pt i{width:11px;height:11px;border-radius:50%;background:var(--ink-2);display:block}
.tl-pt.now i{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-bar{flex:1;height:4px;border-radius:4px;background:var(--line);margin-bottom:22px;position:relative;overflow:hidden}
.tl-bar span{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-weight:800;font-size:18px}
.stepper output{min-width:30px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.food{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--soft);padding:3px 9px 3px 3px;font-size:13.5px;font-weight:700;max-width:100%;min-width:0}
.food .emo{width:28px;height:28px;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-size:16px;flex:none}
.food .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.recipe{background:var(--soft);border-radius:18px;overflow:hidden}
.recipe .r-top{border:0;background:none;width:100%;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.recipe h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:700}
.uses{display:flex;flex-wrap:wrap;gap:5px;font-size:12px;font-weight:700}
.uses span{border-radius:999px;padding:2px 8px;background:var(--c-green);color:var(--c-green-i)}
.uses span.soon{background:var(--c-amber);color:var(--c-amber-i)}
.uses span.buy{background:var(--tile);color:var(--ink-2)}
.r-more{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.r-more ol,.r-more ul{margin:4px 0 0;padding-left:20px;line-height:1.5}
.why{font-size:13px;color:var(--ink-2)}
.cook-box{background:var(--tile);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cb-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.cb-row input{width:20px;height:20px;accent-color:var(--ok);flex:none}

.big-ring{display:flex;align-items:center;gap:16px}
.big-ring svg{width:112px;height:112px;flex:none}
.ring-bg{fill:none;stroke:var(--soft)} .ring-fg{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s} .ring-fg.over{stroke:var(--bad)}
.bar{height:9px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--m-lilac);border-radius:9px}
.chart{width:100%;height:auto;display:block}
.chart .c-bar{fill:var(--m-sky)} .chart .c-bar.over{fill:var(--m-tomato)} .chart .c-bar.today{fill:var(--m-butter)}
.chart .c-target{stroke:var(--ink-2);stroke-dasharray:4 4;stroke-width:1.2}
.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--f);font-weight:700}

.big-chk{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--line);background:var(--field);font-weight:800;font-size:13px;flex:none;display:grid;place-items:center;padding:0;color:var(--ink);transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.big-chk:active{transform:scale(.9)}
.big-chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.big-chk.auto{border-style:dashed;cursor:default}
.big-chk svg.i{width:18px;height:18px;stroke-width:3.2}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--ok)}
.dots i.today{outline:1.5px solid var(--ink-2);outline-offset:1px}

.have{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.have.yes{background:var(--c-green)} .have.no{background:var(--soft)}
.have h4{margin:0;font-size:15px;font-weight:800}
.have ul{margin:0;padding-left:18px;font-size:13.5px;font-weight:600}
.home-tag{font-size:11.5px;font-weight:800;background:var(--c-amber);color:var(--c-amber-i);padding:2px 8px;border-radius:999px;white-space:nowrap}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset button{border:0;background:var(--soft);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13.5px}
.chipset button small{color:var(--ink-2);margin-left:4px}

.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .card b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .card span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.north{background:var(--c-green);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.north b{font-size:38px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--c-green-i)}
.north p{margin:0;font-weight:800;font-size:14px}
.north small{display:block;font-weight:600;color:var(--ink-2);font-size:12.5px}
.pattern{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1.5px solid var(--line)}
.pattern:last-child{border-bottom:0}
.pattern b{display:block;font-weight:800;font-size:14.5px}
.pattern small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px;font-weight:600}
.ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.ic svg.i{width:16px;height:16px}
.ic.red{background:var(--c-red);color:var(--c-red-i)} .ic.amber{background:var(--c-amber);color:var(--c-amber-i)} .ic.green{background:var(--c-green);color:var(--c-green-i)}
.ic.blue{background:var(--c-blue);color:var(--c-blue-i)} .ic.violet{background:var(--c-violet);color:var(--c-violet-i)} .ic.pink{background:var(--c-pink);color:var(--c-pink-i)}

.switch{position:relative;width:50px;height:30px;border-radius:999px;border:0;background:var(--line);padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .25s cubic-bezier(.3,1.6,.5,1);box-shadow:0 1px 3px var(--shadow)}
.switch.on{background:var(--ok)} .switch.on::after{left:23px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px) scale(.95);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.3,1.5,.5,1);background:var(--ink);color:var(--sheet);padding:10px 10px 10px 16px;border-radius:16px;font-weight:700;font-size:14px;z-index:40;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-sizing:border-box;box-shadow:0 8px 20px var(--shadow)}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--accent);padding:4px 8px;font-weight:900;font-size:14px}
.confetti{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:50}

@media (prefers-reduced-motion: reduce){.door,.sheet,.magnet,.toast,.backdrop,.food3d{transition:none!important}.comp.open .door{animation:none;transform:rotateY(105deg)}.comp.closing .door{animation:none}.food3d.soon .fe,.hint-bubble{animation:none}}

/* PM additions */
.card .btn.soft{background:var(--tile)}
.check-pill{position:relative;align-self:flex-start;margin-top:-2px;border:0;background:var(--bad);color:#fff;font-size:10.5px;font-weight:900;border-radius:999px;padding:3px 8px;animation:pulse 2s ease-in-out infinite;z-index:3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,88,74,.45)}50%{box-shadow:0 0 0 6px rgba(240,88,74,0)}}
.check-dots{display:flex;gap:6px;justify-content:center}
.check-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block;transition:all .3s}
.check-dots i.done{background:var(--ok)} .check-dots i.now{width:22px;border-radius:8px;background:var(--accent)}
.check-card{background:var(--soft);border-radius:24px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .3s ease-in,opacity .3s}
.check-card .big{font-size:68px;line-height:1.1;animation:wiggle 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.check-card h3{margin:0;font-size:20px;font-weight:900}
.check-card p{margin:0}
.check-card.fly-r{transform:translateX(120%) rotate(18deg);opacity:0} .check-card.fly-l{transform:translateX(-120%) rotate(-18deg);opacity:0} .check-card.fly-u{transform:translateY(-40px) scale(.9);opacity:0}
.ob-list{display:flex;flex-direction:column;gap:10px}
.ob-row{display:flex;gap:12px;align-items:center}
.ob-row b{display:block;font-weight:800;font-size:14.5px}
.ob-row small{display:block;color:var(--ink-2);font-size:12.5px;font-weight:600}
.ob-emo{font-size:24px;width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.goal{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--field);text-align:left;width:100%;transition:all .2s}
.goal b{flex:1;font-weight:800;font-size:14.5px}
.goal.on{border-color:var(--accent);background:var(--accent-soft)}
.goal-tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.goal.on .goal-tick{background:var(--accent);border-color:var(--accent)}
.goal-tick svg.i{width:14px;height:14px;stroke-width:3}
.goal.start{align-items:flex-start}
.goal.start div{flex:1} .goal.start b{display:block} .goal.start small{display:block;color:var(--ink-2);font-weight:600;font-size:12.5px;margin-top:2px}
.chipset button.on{background:var(--accent);color:#fff}

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (id, cls = "") => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const idOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayId = () => idOf(new Date());
const parseId = id => { const [y, m, d] = String(id).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (id, n) => { const d = parseId(id); d.setDate(d.getDate() + Number(n || 0)); return idOf(d); };
const diffDays = (a, b) => Math.round((parseId(b) - parseId(a)) / 86400000);
const fmtDay = id => parseId(id).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
const fmtShort = id => parseId(id).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const dayName = wd => new Date(2026, 0, 4 + Number(wd)).toLocaleDateString(undefined, { weekday: "long" });
const money = n => "$" + (Number(n) || 0).toFixed(2);
const num = n => Math.round(Number(n) || 0).toLocaleString();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const normName = n => String(n || "").toLowerCase().replace(/[^a-z0-9& ]/g, " ").replace(/\s+/g, " ").trim();
const tokens = s => normName(s).split(" ").filter(w => w.length >= 3).map(w => w.replace(/(es|s)$/, ""));
function nameMatch(a, b) {
  const A = normName(a), B = normName(b);
  if (!A || !B) return false;
  if (A.includes(B) || B.includes(A)) return true;
  const ta = tokens(A), tb = tokens(B);
  return ta.some(x => tb.some(y => x === y || (x.length > 3 && y.length > 3 && (x.startsWith(y) || y.startsWith(x)))));
}

/* ---------- food knowledge ---------- */
const ZONES = { top: "Top shelf · dairy & eggs", middle: "Middle shelf · ready to eat", bottom: "Bottom shelf · meat & fish", crisper: "Crisper drawer · fruit & veg", door: "Door shelves", freezer: "Freezer" };
const ZONE_SHORT = { top: "Top shelf", middle: "Middle shelf", bottom: "Bottom shelf", crisper: "Crisper", door: "Door", freezer: "Freezer" };
const CATS = { produce: "crisper", fruit: "crisper", dairy: "top", eggs: "top", cheese: "top", protein: "middle", meat: "bottom", fish: "bottom", leftovers: "middle", bakery: "middle", condiments: "door", drinks: "door", frozen: "freezer", grains: "middle", snacks: "middle", other: "middle" };
const KW = [
  ["frozen|ice cream|popsicle", "frozen", "🧊", 90], ["spinach|lettuce|kale|greens|arugula|salad mix|romaine|methi", "produce", "🥬", 4], ["cilantro|coriander|parsley|basil|mint|herb", "produce", "🌿", 5],
  ["tomato", "produce", "🍅", 6], ["pepper|capsicum", "produce", "🫑", 7], ["carrot", "produce", "🥕", 21], ["broccoli|cauliflower", "produce", "🥦", 5],
  ["onion|shallot", "produce", "🧅", 30], ["garlic|ginger", "produce", "🧄", 45], ["potato", "produce", "🥔", 30], ["cucumber|zucchini", "produce", "🥒", 7],
  ["mushroom", "produce", "🍄", 5], ["corn", "produce", "🌽", 4], ["eggplant|brinjal", "produce", "🍆", 6], ["avocado", "fruit", "🥑", 4], ["banana", "fruit", "🍌", 5],
  ["apple", "fruit", "🍎", 21], ["berr", "fruit", "🫐", 4], ["lemon|lime", "fruit", "🍋", 21], ["juice", "drinks", "🧃", 7], ["orange|clementine|mandarin", "fruit", "🍊", 14],
  ["grape", "fruit", "🍇", 7], ["mango", "fruit", "🥭", 5], ["pear|peach|plum", "fruit", "🍐", 6], ["melon", "fruit", "🍉", 5],
  ["milk", "dairy", "🥛", 7], ["yogurt|yoghurt|curd|dahi|kefir", "dairy", "🥣", 14], ["paneer", "dairy", "🧀", 7], ["tofu|tempeh", "protein", "🧈", 5],
  ["cheese|cheddar|mozzarella|parmesan|feta", "cheese", "🧀", 21], ["butter|ghee", "dairy", "🧈", 60], ["cream", "dairy", "🥛", 10], ["egg", "eggs", "🥚", 28],
  ["chicken", "meat", "🍗", 2], ["beef|steak|mince|ground|lamb|pork", "meat", "🥩", 2], ["turkey", "meat", "🍗", 2], ["bacon|ham|sausage|salami", "meat", "🥓", 7],
  ["salmon|fish|tuna|shrimp|prawn|cod|tilapia", "fish", "🐟", 2], ["bread|bagel|tortilla|roti|naan|bun|pita", "bakery", "🍞", 5],
  ["rice|quinoa", "grains", "🍚", 365], ["pasta|noodle|spaghetti", "grains", "🍝", 365], ["oat|cereal|granola", "grains", "🥣", 180], ["flour|atta|besan|sugar", "grains", "🫙", 180],
  ["lentil|dal|chickpea|chana|beans|rajma", "grains", "🫘", 365], ["hummus|dip|salsa", "condiments", "🫙", 7], ["honey", "condiments", "🍯", 365],
  ["sauce|ketchup|mustard|mayo|chutney|pickle|achaar|jam|dressing", "condiments", "🫙", 90], ["leftover|cooked|curry|soup", "leftovers", "🍱", 4],
  ["soda|kombucha|water|coffee|tea|sparkling", "drinks", "🥤", 30], ["chips|cookie|cracker|bar|chocolate", "snacks", "🍪", 60], ["nut|almond|peanut|cashew|walnut", "snacks", "🥜", 120]
];
function guess(name) {
  const n = String(name || "").toLowerCase();
  for (const [re, cat, emoji, life] of KW) if (new RegExp(re).test(n)) return { cat, emoji, life, zone: CATS[cat] };
  return { cat: "other", emoji: "🛒", life: 7, zone: "middle" };
}

/* ---------- state ---------- */
const DEF_HABITS = [
  { id: "water", name: "Drink water", target: 8, unit: "glasses" },
  { id: "veg", name: "Eat veggies", target: 3, unit: "servings" },
  { id: "cook", name: "Cook at home", target: 1 },
  { id: "walk", name: "Walk 30 min", target: 1 },
  { id: "late", name: "No snacks after 9pm", target: 1 }
];
const AUTO_HABITS = [{ id: "auto-kcal", name: "Hit my calorie goal", auto: true }, { id: "auto-steps", name: "Reach my step goal", auto: true }, { id: "auto-waste", name: "Nothing tossed today", auto: true }];
const DEF_SETTINGS = { kcal: 1600, protein: 100, noNumbers: false, habits: DEF_HABITS, savedRebuys: 0 };
const S = { ready: false, mode: "loading", items: [], days: {}, settings: { ...DEF_SETTINGS }, shopping: { items: [] } };
const UI = { open: { main: false, freezer: false } };
let SH = null;

const active = () => S.items.filter(i => i.status === "fresh" && i.zone !== "pantry");
const daysLeft = it => diffDays(todayId(), it.expiresAt);
function lifeInfo(it) {
  const d = daysLeft(it);
  if (d < 0) return { cls: "bad", label: "Expired", short: "expired" };

  } catch (e) { if (e && e.name === "AbortError") return; }

    Object.keys(S.days).filter(id => !d.days[id]).forEach(deleteDay);

function studyMetrics() {

  const since = [firstItem, firstMeal].filter(Boolean).sort()[0] || null;

  const fmt = (v, s = "") => v == null ? "–" : v + s;
  const rows = [

    { k: "Food eaten before it expired (30d)", v: fmt(m30.rate, "%"), t: "≥ 80%", ok: m30.rate == null ? null : m30.rate >= 80 },
    { head: "Supporting" },
    { k: "Meals cooked from fridge / week", v: String(m7.cooked), t: "≥ 4", ok: m7.cooked >= 4 },
    { k: "Money thrown away (30d)", v: money(m30.tossedValue), t: "↓ over time", ok: null },
    { k: "Rebuys avoided (30d)", v: String(m30.skips), t: "↑ over time", ok: null },
    { k: "Past-date items resolved (30d)", v: String(m30.checks), t: "keeps list true", ok: null },
    { head: "Guardrails" },

    { k: "Active days, last 28", v: `${m28.activeDays}/28`, t: "≥ 16 (wk-4 retention)", ok: m28.activeDays >= 16 },

  ];
  return { since, rows, text: `What's In My Fridge — self-study metrics${since ? ` (since ${since})` : ""}\n` + rows.map(r => r.head ? `\n${r.head}` : `• ${r.k}: ${r.v} (target ${r.t})`).join("\n") };
}

    case "set-nudge": { const on = !S.settings.nudge; S.settings = { ...S.settings, nudge: on }; putSettings(); if (on && Native?.LN) Promise.resolve(Native.LN.requestPermissions()).catch(() => {}).finally(scheduleNudges); else scheduleNudges(); renderSheet(); break; }
    case "set-key": { const v = ($("#setKey")?.value || "").trim(); try { if (v) localStorage.setItem("fridge.apikey", v); else localStorage.removeItem("fridge.apikey"); } catch (_) {} initApiAI(); renderSheet(); toast(v ? "Key saved on this phone." : "Key removed."); break; }
    case "replay-welcome": closeSheet(); setTimeout(() => openSheet("welcome"), 250); break;
    case "backup-save": saveBackup(); break;
    case "backup-copy": copyBackup(); break;
    case "restore-open": SH.set.restore = true; renderSheet(); break;
    case "restore-no": SH.set.restore = false; SH.set.pending = null; renderSheet(); break;
    case "restore-check": { const d = parseBackup($("#restoreText")?.value); if (!d) { toast("That doesn't look like a Fridge backup."); break; } SH.set.pending = d; renderSheet(); break; }
    case "restore-yes": { const d = SH.set.pending; if (!d) break; restoreData(d); closeSheet(); toast("Restored. Welcome back."); break; }
    case "quick-log": { const r = el.getBoundingClientRect(); burst(r.right - 30, r.top + r.height / 2, 14); logFromLibrary(el.dataset.key, el.dataset.slot, 1); break; }
    // log
    case "log-slot": SH.log.slot = el.dataset.slot; SH.log.logged = {}; renderSheet(); break;
    case "log-portion": SH.log.portion = Number(el.dataset.p); renderSheet(); break;
    case "log-lib": { const r = el.getBoundingClientRect(); burst(r.right - 20, r.top + r.height / 2, 12); logFromLibrary(el.dataset.key, SH.log.slot, SH.log.portion); break; }
    case "log-ai": logAI(null); break;
    case "log-stop": SH.log.ctl?.abort(); break;
    case "log-est": { const L = SH.log, x = L.est; if (!x || !String(x.name).trim()) { toast("Give the dish a name."); break; } logEntry(x.name, x.kcal, x.protein, L.slot, L.portion, { carbs: x.carbs, fat: x.fat, src: x.source && /official/i.test(x.source) ? x.source : "" }); L.est = null; L.q = ""; if (L.url) { URL.revokeObjectURL(L.url); L.url = null; L.file = null; } L.status = "idle"; renderSheet(); break; }
    case "log-show-manual": SH.log.manual = true; SH.log.mName = SH.log.mName || SH.log.q; renderSheet(); setTimeout(() => $("#mKcal")?.focus(), 30); break;
    case "log-manual": { const L = SH.log; if (!L.mName.trim()) { toast("Give the dish a name."); break; } logEntry(L.mName, L.mKcal, L.mProt, L.slot, 1); L.mName = L.mKcal = L.mProt = ""; L.manual = false; L.q = ""; renderSheet(); break; }
    case "meal-del": { const T = todayId(), m = (dayOf(T).meals || []).find(x => x.id === el.dataset.id); editDay(T, d => { d.meals = d.meals.filter(x => x.id !== el.dataset.id); }); renderAll(); renderSheet(); if (m) toast(`Removed ${m.name}.`, () => { editDay(T, d => d.meals.push(m)); renderAll(); refreshSheet(); }); break; }
    // scan
    case "scan-mode": (SH.scan.urls || []).forEach(u => URL.revokeObjectURL(u)); SH.scan = { mode: el.dataset.mode, file: null, url: null, files: [], urls: [], status: "idle", rows: [], seen: [], missing: [], meta: {} }; renderSheet(); break;
    case "scan-read": scanRead(); break;
    case "scan-stop": SH.scan.ctl?.abort(); break;
    case "scan-add": scanAdd(); break;
    // item
    case "it-qty": itemAct(it => { const n = (it.qty || 1) + Number(el.dataset.d); if (n <= 0) { const prev = { ...it }; putItem({ ...it, qty: 0, status: "used", closedAt: todayId() }); closeSheet(); toast(`${it.name} used up.`, () => { putItem(prev); renderAll(); }); } else { putItem({ ...it, qty: n }); renderSheet(); } renderAll(); }); break;
    case "it-close": itemAct(it => { const prev = { ...it }; putItem({ ...it, status: el.dataset.st, closedAt: todayId() }); renderAll(); closeSheet(); toast(el.dataset.st === "used" ? `Nice, no waste.` : `${it.name} tossed.`, () => { putItem(prev); renderAll(); }); }); break;
    case "it-restore": itemAct(it => { const c = { ...it, status: "fresh", qty: Math.max(1, it.qty || 1) }; delete c.closedAt; putItem(c); renderAll(); renderSheet(); }); break;
    case "it-delete": itemAct(it => { const prev = { ...it }; removeItem(it.id); renderAll(); closeSheet(); toast(`Deleted ${it.name}.`, () => { putItem(prev); renderAll(); }); }); break;
    case "it-shop": itemAct(it => shopAdd(it.name)); break;
    case "it-recipes": closeSheet(); setTimeout(() => openSheet("recipes"), 200); break;
    // recipes
    case "rec-ai": recAI(); break;
    case "rec-stop": SH.rec.ctl?.abort(); break;
    case "rec-open": SH.rec.open = SH.rec.open === Number(el.dataset.i) ? -1 : Number(el.dataset.i); SH.rec.cook = -1; (SH.kind === "quick" ? renderQuick() : renderSheet()); break;
    case "rec-cook": SH.rec.cook = Number(el.dataset.i); SH.rec.sel = {}; SH.rec.servings = 1; (SH.kind === "quick" ? renderQuick() : renderSheet()); break;
    case "rec-serv": SH.rec.servings = clamp(SH.rec.servings + Number(el.dataset.d), 0.5, 4); (SH.kind === "quick" ? renderQuick() : renderSheet()); break;
    case "rec-log": recLog(Number(el.dataset.i)); break;
    // shopping
    case "shop-add": shopAdd(SH.shop.q); SH.shop.q = ""; renderSheet(); break;
    case "shop-add-name": shopAdd(el.dataset.name); renderSheet(); break;
    case "shop-skip": S.settings = { ...S.settings, savedRebuys: (S.settings.savedRebuys || 0) + 1 }; putSettings(); track("skips"); toast("Skipped. You already have it."); SH.shop.q = ""; renderSheet(); break;
    case "shop-del": S.shopping = { ...S.shopping, items: S.shopping.items.filter(x => x.id !== el.dataset.id) }; putShopping(); renderAll(); renderSheet(); break;
    case "shop-clear": S.shopping = { ...S.shopping, items: S.shopping.items.filter(x => !x.done) }; putShopping(); renderAll(); renderSheet(); break;
    // settings
    case "set-nonum": S.settings = { ...S.settings, noNumbers: !S.settings.noNumbers }; putSettings(); renderAll(); renderSheet(); break;
    case "habit-del": { const hs = [...S.settings.habits]; hs.splice(Number(el.dataset.i), 1); S.settings = { ...S.settings, habits: hs }; putSettings(); renderAll(); renderSheet(); break; }
    case "habit-add": { const s = SH.set, name = s.newHabit.trim(); if (!name) { toast("Name the habit first."); break; } const t = Math.max(1, Number(s.newTarget) || 1); S.settings = { ...S.settings, habits: [...S.settings.habits, { id: "h" + uid(), name, target: t, unit: t > 1 ? "times" : "" }] }; putSettings(); s.newHabit = ""; s.newTarget = 1; renderAll(); renderSheet(); break; }
    case "reset-ask": SH.set.confirmReset = true; renderSheet(); break;
    case "reset-no": SH.set.confirmReset = false; renderSheet(); break;
    case "reset-yes": resetAll(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && SH) closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && e.target.id === "shopQ") { e.preventDefault(); shopAdd(SH.shop.q); SH.shop.q = ""; renderSheet(); setTimeout(() => $("#shopQ")?.focus(), 20); }
  if (e.key === "Enter" && e.target.id === "logQ") { e.preventDefault(); const L = SH.log, q = normName(L.q), hit = mealLibrary().find(x => x.key === q); if (hit) { logFromLibrary(hit.key, L.slot, L.portion); L.q = ""; renderSheet(); } else if (aiOn()) logAI(null); else { L.manual = true; L.mName = L.q; renderSheet(); } }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "quickIn") { e.preventDefault(); const t = SH.q.text.trim(); if (!t) return; const it = !SH.q.force && detectIntent(t); if (it) { runIntent(it); return; } if (isQuestion(t) && !SH.q.force) quickAsk(); else { if (!SH.q.items?.length) SH.q.items = parseQuick(t); quickAdd(); } return; }
  if (e.key === "Enter" && e.target.id === "recPref") { e.preventDefault(); recAI(); }
});
document.addEventListener("submit", e => { if (e.target.id === "addForm") { e.preventDefault(); addSubmit(); } });
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.row !== undefined && SH?.scan) { const r = SH.scan.rows[Number(d.row)]; if (!r) return; if (d.f === "on") { r.on = t.checked; renderSheet(); } else { r[d.f] = t.value; r.edited = true; } return; }
  if (d.addf && SH?.add) { const a = SH.add; a[d.addf] = t.value; if (d.addf === "zone") a.touchedZone = true; if (d.addf === "name") { $("#addHint").innerHTML = addHint(a); const g = guess(a.name); if (!a.touchedZone) $("#addZone").value = g.zone; if (a.days === "") $("#addDays").value = shelfLifeFor(a.name); } if (d.addf === "days") a.days = t.value; return; }
  if (d.recf && SH?.rec) { SH.rec[d.recf] = t.value; return; }
  if (d.prof && SH?.cal) { SH.cal.prof = { ...(SH.cal.prof || profDraft()), [d.prof]: t.value }; return; }
  if (d.qf && SH?.q) { SH.q.text = t.value; SH.q.force = false; autoGrow(t); if (SH.q.answer && t.value.trim()) { SH.q.answer = ""; SH.q.err = ""; SH.rec = null; } renderQuick(); return; }
  if (d.obf && SH?.ob) { SH.ob[d.obf] = t.value; return; }
  if (d.logf && SH?.log) { SH.log[d.logf] = t.value; if (d.logf === "q") { SH.log.build = null; renderLogMatches(); } return; }
  if (d.estf && SH?.log?.est) { SH.log.est[d.estf] = t.value; return; }
  if (d.shopf && SH?.shop) { SH.shop.q = t.value; renderHave(); return; }
  if (d.newh && SH?.set) { SH.set[d.newh === "name" ? "newHabit" : "newTarget"] = t.value; return; }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (t.id === "scanFile" && t.files?.length && SH?.scan) { setScanFiles(SH.scan, t.files); SH.scan.status = "idle"; SH.scan.rows = []; renderSheet(); return; }
  if (t.id === "qPhotos" && t.files?.length) { const fs = Array.from(t.files); closeSheet(); setTimeout(() => openSheet("scan", { files: fs }), 200); return; }
  if (t.id === "homePhotos" && t.files?.length) { const fs = Array.from(t.files); t.value = ""; if (SH) closeSheet(); setTimeout(() => openSheet("scan", { files: fs }), SH ? 200 : 0); return; }
  if (t.id === "restoreFile" && t.files?.[0] && SH?.set) { t.files[0].text().then(txt => { const d = parseBackup(txt); if (!d) { toast("That file isn't a Fridge backup."); return; } SH.set.pending = d; renderSheet(); }); return; }
  if (t.id === "stepsIn") { const v = Math.round(+t.value); if (t.value === "" || v >= 0) setSteps(v || 0); return; }
  if (t.id === "activeIn") { editAct(todayId(), a => { if (t.value === "") delete a.active; else a.active = Math.max(0, Math.round(+t.value)); }); return; }
  if (t.id === "stepGoalIn") { const v = Math.round(+t.value); if (v >= 1000) { S.settings = { ...S.settings, stepGoal: v }; putSettings(); renderAll(); } return; }
  if (t.id === "setNudgeT" && t.value) { S.settings = { ...S.settings, nudgeTime: t.value }; putSettings(); scheduleNudges(); return; }
  if (t.id === "plateFile" && t.files?.[0] && SH?.log) { logAI(t.files[0]); return; }
  if (d.miss !== undefined && SH?.scan) { SH.scan.missing[Number(d.miss)].on = t.checked; renderSheet(); return; }
  if (d.itf) { itemAct(it => { const v = t.value; if (d.itf === "name" && !v.trim()) return; const n = { ...it, [d.itf]: d.itf === "name" ? v.trim() : v }; if (d.itf === "name") { const g = guess(v); n.emoji = g.emoji; n.cat = g.cat; } putItem(n); renderAll(); $("#sheetTitle").textContent = n.name; }); return; }
  if (d.cooksel && SH?.rec) { SH.rec.sel[d.cooksel] = t.checked; return; }
  if (d.shopdone) { S.shopping = { ...S.shopping, items: S.shopping.items.map(x => x.id === d.shopdone ? { ...x, done: t.checked } : x) }; putShopping(); renderAll(); renderSheet(); return; }
  if (d.setf) { const v = Math.round(Number(t.value)); if (v > 0) { S.settings = { ...S.settings, [d.setf]: v }; putSettings(); renderAll(); } return; }
});
setInterval(() => { if (!SH) renderDock(); }, 10 * 60 * 1000);
init();
</script>
<script>if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>

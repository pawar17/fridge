<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}body{margin:0;font:14px system-ui,sans-serif;background:#fffdf2}@media (prefers-color-scheme: dark){body{background:#15130e}}img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="star-180.png?v=13"><link rel="icon" type="image/png" href="star-192.png?v=13"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Snatched"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f1"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#f6f5f1"></head><body>
<title>Snatched</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700&display=swap">

<style>
/* Layout: a soft-shaded pastel fridge standing in a lilac kitchen. Doors bounce open onto glass shelves of little food; glossy magnets are dragged around the door and tapped to open paper-like sheets; a dock under the fridge logs your usual meal. */
:root{
  --wall-1:#fffdf2; --wall-2:#fff6d4; --wall-glow:rgba(255,255,255,0); --floor-1:#f3e6c9; --floor-2:#e6d3ab; --btn-bg:#1d1d1f; --btn-fg:#ffffff;
  --fr-hi:#fbfcfd; --fr-1:#e3e7eb; --fr-2:#cbd1d7; --fr-3:#a3abb3; --fr-seam:#8b949c; --chrome-1:#ffffff; --chrome-2:#b9c1c8; --chrome-3:#7f8990;
  --in-1:#fffdf6; --in-2:#eef6f4; --in-wall:#e3efec; --glass-1:rgba(255,255,255,.95); --glass-2:rgba(170,215,225,.55); --liner:#e7f2ef;
  --ink:#1d1d1f; --ink-2:#6e6e73; --line:#e5e5ea; --soft:#f2f2f7; --field:#ffffff; --sheet:#ffffff; --tile:#ffffff; --paper:#fffdf7;
  --accent:#ff7a6b; --accent-soft:#ffe5e0;
  --m-tomato:#ff7a6b; --m-butter:#ffd36e; --m-sky:#8cc8ff; --m-lilac:#b9a4ff; --m-pink:#ff9ec4; --m-peach:#ffb38a; --m-mint:#6fd6b4;
  --c-red:#ffe1dc; --c-red-i:#d9483b; --c-amber:#fff0cc; --c-amber-i:#b37400; --c-green:#dcf5e8; --c-green-i:#1f8a52;
  --c-blue:#e1efff; --c-blue-i:#2f6fc0; --c-violet:#eee8ff; --c-violet-i:#6a4fc9; --c-pink:#ffe6f0; --c-pink-i:#c2457a;
  --ok:#2fb36d; --warn:#f0a020; --bad:#f0584a;
  --shadow:rgba(0,0,0,.16); --shadow-2:rgba(0,0,0,.06);
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, "Segoe UI", sans-serif;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 130% 55% at 50% 0%,var(--wall-glow),transparent 70%),linear-gradient(180deg,var(--wall-1),var(--wall-2) 80%);background-color:var(--wall-2);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;position:relative;overflow:hidden;box-sizing:border-box}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 0;gap:8px}
.topbar h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.topbar .sub{font-size:13px;color:var(--ink-2);font-weight:600}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--tile);box-shadow:0 1px 3px var(--shadow-2);display:grid;place-items:center;color:var(--ink)}

/* top of fridge */
.fridge-top{height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding-inline:18px}
.basket{border:0;background:none;padding:0;display:flex;align-items:flex-end;gap:6px;transform-origin:bottom center}
.basket:active{transform:scale(.96)}
.basket-body{position:relative;width:78px;height:30px;border-radius:5px 5px 16px 16px;background:repeating-linear-gradient(90deg,#d99a5c 0 7px,#c5854a 7px 9px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.08)}
.basket-body::before{content:"";position:absolute;left:12px;right:12px;top:-15px;height:20px;border:4px solid #b97a40;border-bottom:0;border-radius:30px 30px 0 0}
.basket-body i{position:absolute;top:-16px;font-size:20px;font-style:normal;filter:drop-shadow(0 2px 1px rgba(0,0,0,.15))}
.basket-count{background:var(--tile);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;margin-bottom:4px;box-shadow:0 2px 0 var(--shadow-2)}
.plant{font-size:32px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}

/* fridge body */
.fridge-wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;margin-top:14px}
.fridge{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;padding:0;border-radius:30px 30px 18px 18px;background:linear-gradient(90deg,var(--fr-3) 0,var(--fr-2) 4%,var(--fr-1) 14%,var(--fr-hi) 30%,var(--fr-1) 55%,var(--fr-2) 88%,var(--fr-3) 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -6px 0 rgba(0,0,0,.08),0 22px 30px -18px var(--shadow);position:relative;z-index:1}
.fridge.thunk{animation:thunk .35s ease-out}
@keyframes thunk{0%{transform:translateY(0)}30%{transform:translateY(2px) scaleY(.995)}60%{transform:translateY(-1px)}100%{transform:none}}
.feet{height:10px;display:flex;justify-content:space-between;padding-inline:34px;position:relative;z-index:0}
.feet i{width:22px;height:8px;border-radius:0 0 6px 6px;background:var(--fr-seam);display:block}
.floor{height:34px;margin-inline:-16px;background:linear-gradient(180deg,var(--floor-1),var(--floor-2));position:relative;margin-top:-4px}
.floor::before{content:"";position:absolute;left:12%;right:12%;top:0;height:14px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(40,30,50,.22),transparent 70%)}
.comp{position:relative;perspective:1400px;perspective-origin:20% 50%;min-height:0}
.comp.freezer{flex:0 0 23%;border-bottom:4px solid var(--fr-seam)}
.comp.main{flex:1}
.comp.freezer .door,.comp.freezer .inside{border-radius:30px 30px 6px 6px}
.comp.main .door,.comp.main .inside{border-radius:6px 6px 18px 18px}
.inside{position:absolute;inset:6px;border-radius:inherit;background:linear-gradient(180deg,var(--in-1),var(--in-2));box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 7px rgba(0,0,0,.06),inset 0 14px 30px rgba(0,0,0,.12);overflow-y:auto;overscroll-behavior:contain;visibility:hidden}
.comp.open .inside,.comp.opening .inside,.comp.closing .inside{visibility:visible}
.inside::after{content:"";position:sticky;top:0;display:block;height:0}
.glow{position:absolute;inset:6px;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse at 50% 0,rgba(255,244,190,.85),transparent 60%);opacity:0;z-index:1}
.comp.open .glow{animation:flicker .7s ease-out forwards}
@keyframes flicker{0%{opacity:0}15%{opacity:1}25%{opacity:.3}40%{opacity:1}100%{opacity:.75}}
.door{position:absolute;inset:0;transform-origin:right center;transform-style:preserve-3d;z-index:3}
.comp.open .door{animation:doorOpen .95s cubic-bezier(.3,.6,.3,1) forwards;pointer-events:none}
.comp.closing .door{animation:doorClose .55s cubic-bezier(.5,0,.6,1) forwards}
@keyframes doorOpen{0%{transform:rotateY(0)}55%{transform:rotateY(120deg)}75%{transform:rotateY(98deg)}90%{transform:rotateY(109deg)}100%{transform:rotateY(105deg)}}
@keyframes doorClose{0%{transform:rotateY(105deg)}78%{transform:rotateY(-3deg)}90%{transform:rotateY(1.5deg)}100%{transform:rotateY(0)}}
.face{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px,transparent 2px 4px),linear-gradient(115deg,transparent 20%,rgba(255,255,255,.35) 30%,transparent 42%,transparent 62%,rgba(255,255,255,.18) 70%,transparent 78%),linear-gradient(90deg,var(--fr-2) 0,var(--fr-1) 10%,var(--fr-hi) 32%,var(--fr-1) 58%,var(--fr-2) 94%,var(--fr-3) 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.07);container-type:size}
.face.front::after{content:"";position:absolute;top:0;bottom:0;left:24%;width:9%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);pointer-events:none;border-radius:inherit}
.face.back{transform:rotateY(180deg);background:var(--liner);box-shadow:inset 0 0 0 6px #fff}
.handle{position:absolute;left:12px;width:14px;border:0;border-radius:8px;padding:0;z-index:5;background:linear-gradient(90deg,var(--chrome-1),var(--chrome-2) 55%,var(--chrome-3));box-shadow:2px 3px 5px rgba(0,0,0,.18),inset 0 1px 0 #fff}
.handle::before,.handle::after{content:"";position:absolute;left:3px;width:8px;height:8px;border-radius:2px;background:var(--chrome-3)}
.handle::before{top:-5px}.handle::after{bottom:-5px}
.handle:active{transform:translateX(2px)}
.h-freezer{bottom:16px;height:42%}
.h-main{top:16px;height:24%}
.hit{position:absolute;inset:-10px -14px}

/* magnets */
.magnet{position:absolute;touch-action:none;cursor:grab;z-index:2;transition:transform .25s cubic-bezier(.3,1.6,.5,1),filter .2s;transform:rotate(var(--r,0deg));filter:drop-shadow(0 4px 6px var(--shadow)) drop-shadow(0 1px 1px rgba(0,0,0,.08))}
.magnet:active{cursor:grabbing}
.magnet.dragging{transform:rotate(0deg) scale(1.08);filter:drop-shadow(0 18px 16px var(--shadow));z-index:10;transition:filter .2s}
.magnet.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:rotate(var(--r)) scale(1)}40%{transform:rotate(0) scale(1.12)}100%{transform:rotate(var(--r)) scale(1)}}
.gloss{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.85) 0 7%,rgba(255,255,255,.25) 22%,transparent 45%),linear-gradient(165deg,color-mix(in srgb,var(--mc) 70%,#fff),var(--mc) 55%,color-mix(in srgb,var(--mc) 80%,#000));box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.6)}
.pin{position:absolute;top:-10px;left:50%;margin-left:-12px;width:24px;height:24px;border-radius:50%;z-index:2}
.paper{background:var(--paper);color:#2c2838;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.paper.lined{background:linear-gradient(var(--paper) 0 26px,transparent 26px) ,repeating-linear-gradient(180deg,var(--paper) 0 21px,#dfe8f7 21px 22px)}
.m-title{font-size:13px;font-weight:600;letter-spacing:-.01em;color:#6e6e73}

#mag-eat{width:45cqw;height:42cqh;--r:-.6deg;padding:16px 11px 9px;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;overflow:visible}
#mag-eat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
#mag-eat li{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;min-width:0}
#mag-eat li .e{font-size:16px;flex:none}
#mag-eat li .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mag-eat li .d{font-size:11px;font-weight:700;flex:none}
#mag-eat .foot{margin-top:auto;font-size:11.5px;font-weight:700;color:#8a8398}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.t-bad{color:var(--bad)} .t-warn{color:var(--warn)} .t-ok{color:var(--ok)}
.bg-bad{background:var(--bad)} .bg-warn{background:var(--warn)} .bg-ok{background:var(--ok)}

#mag-cal{--mc:var(--m-butter);--r:.8deg;width:min(36cqw,27cqh);height:min(36cqw,27cqh);border-radius:50%;display:grid;place-items:center;color:#3a2f10}
#mag-cal svg{position:absolute;inset:10%;width:80%;height:80%}
#mag-cal .ring-bg{fill:none;stroke:rgba(255,255,255,.55)} #mag-cal .ring-fg{fill:none;stroke:#e0663b;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,1.3,.5,1)}
#mag-cal .ring-fg.over{stroke:var(--bad)}
#mag-cal .c-txt{position:relative;text-align:center;line-height:1.05}
#mag-cal b{display:block;font-size:clamp(17px,6cqw,24px);font-weight:700;font-variant-numeric:tabular-nums}
#mag-cal small{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.75}

#mag-habits{width:39cqw;height:29cqh;--r:.5deg;padding:14px 10px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;overflow:visible}
.hrow{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;min-width:0}
.hrow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow small{font-size:11px;color:#8a8398;font-variant-numeric:tabular-nums;font-weight:600}
.chk{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid #b8b0c8;background:#fff;display:grid;place-items:center;padding:0;color:#fff;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.chk svg.i{width:13px;height:13px;stroke-width:3.2}
.chk.on{background:var(--ok);border-color:var(--ok);transform:scale(1.08)}
.chk.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{50%{transform:scale(1.35)}}

.badge{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:28%;text-align:center;gap:2px;color:#2c2838}
.badge .emo{font-size:clamp(26px,10cqw,38px);line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.badge b{font-size:11.5px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.badge small{font-size:10px;font-weight:600;opacity:.75;line-height:1.1}
#mag-cook{--mc:var(--m-peach);--r:0deg;width:min(26cqw,20cqh);height:min(26cqw,20cqh)}
#mag-scan{--mc:var(--m-sky);--r:0deg;width:min(26cqw,20cqh);height:min(26cqw,20cqh)}
#mag-shop{width:39cqw;height:28cqh;--r:-.8deg;padding:15px 10px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;overflow:visible;background:#ffe3ee}
#mag-shop ul{list-style:none;margin:0;padding:0;font-size:13px;font-weight:700;line-height:1.35;min-height:0;overflow:hidden}
#mag-shop li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mag-shop li::before{content:"○ ";color:#c07a98}
#mag-shop .m-title{color:#b0628a}
.cam{position:relative;width:60%;aspect-ratio:1.45;background:#fff;border-radius:18%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.cam::before{content:"";position:absolute;left:50%;top:52%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 34%,#9ab 0 12%,#1d2433 16% 44%,#56627a 48% 58%,#2c2838 62%)}
.cam::after{content:"";position:absolute;right:10%;top:12%;width:14%;height:12%;border-radius:3px;background:var(--m-tomato)}

#mag-score{--mc:var(--m-mint);--r:-1deg;width:min(26cqw,70cqh);height:min(26cqw,70cqh);border-radius:50%;color:#10392b}
#mag-score b{font-size:clamp(18px,6cqw,24px);font-weight:700;letter-spacing:-.01em}
#mag-lab{--mc:var(--m-lilac);--r:.8deg;width:min(24cqw,62cqh);height:min(24cqw,62cqh);color:#2a1d5c;gap:0}
#mag-lab .move-ring svg{width:min(9cqw,24cqh);height:min(9cqw,24cqh);display:block}
#mag-lab b{font-size:12px}
.letters{position:absolute;left:44px;top:50%;transform:translateY(-50%);display:flex;gap:2px;pointer-events:none}
.letters span{font-size:clamp(20px,7.5cqw,30px);font-weight:700;color:var(--lc);text-shadow:0 1px 0 rgba(255,255,255,.6),0 3px 0 rgba(0,0,0,.18);transform:rotate(var(--lr))}

.hint-bubble{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--sheet);font-size:13px;font-weight:700;padding:10px 14px;border-radius:14px;text-align:center;box-shadow:0 10px 20px var(--shadow);max-width:80%;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translate(-50%,-56%)}}

/* inside: shelves and food */
.in-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:14px 14px 6px;background:linear-gradient(var(--in-1) 70%,transparent)}
.in-head h2{margin:0;font-size:18px;font-weight:700;flex:1;color:#2c2838}
.in-head h2 small{font-size:12.5px;font-weight:700;color:#8a8398;margin-left:6px}
.swipe-hint{padding:0 14px 4px;font-size:12px;font-weight:700;color:#8a8398;display:flex;gap:14px}
.swipe-hint b{color:var(--ok)} .swipe-hint i{font-style:normal;color:var(--bad);font-weight:600}
.shelf{position:relative;padding:18px 10px 12px;margin:0 6px}
.shelf::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:9px;border-radius:3px;background:linear-gradient(180deg,var(--glass-1),var(--glass-2));box-shadow:0 4px 6px rgba(80,120,140,.18),inset 0 1px 0 #fff}
.shelf-tag{position:absolute;top:2px;left:10px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#9c96aa}
.shelf.drawer{margin:10px 12px 12px;padding:18px 8px 10px;border-radius:10px 10px 18px 18px;background:linear-gradient(180deg,rgba(190,235,220,.25),rgba(160,215,200,.45));box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),inset 0 -8px 0 rgba(120,190,170,.25)}
.shelf.drawer::after{display:none}
.shelf.doorbin{margin:4px 12px 12px;padding:18px 8px 8px;border-radius:6px 6px 14px 14px;background:linear-gradient(180deg,transparent 40%,rgba(200,225,235,.45) 40%);}
.shelf.doorbin::after{display:none}
.row-food{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 2px;min-height:62px}
.food3d{position:relative;width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:2px 0;touch-action:pan-y;color:#2c2838;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .25s}
.food3d .fe{font-size:31px;line-height:1.05;filter:drop-shadow(0 4px 2px rgba(0,0,0,.18));transition:transform .2s}
.food3d .fn{max-width:60px;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.food3d .fd{font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 6px;line-height:1.3}
.fd.ok{background:#dcf5e8;color:#1f8a52} .fd.warn{background:#fff0cc;color:#a86a00} .fd.bad{background:#ffe1dc;color:#d9483b} .fd.muted{background:#efedf3;color:#8a8398}
.food3d .qty{position:absolute;top:0;right:6px;background:#2c2838;color:#fff;font-size:9.5px;font-weight:700;border-radius:999px;padding:0 5px;line-height:1.5}
.food3d.soon .fe{animation:wiggle 2.6s ease-in-out infinite}
.food3d.gone .fe{filter:grayscale(.5) drop-shadow(0 4px 2px rgba(0,0,0,.18));opacity:.8}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-9deg)}88%{transform:rotate(8deg)}92%{transform:rotate(-5deg)}96%{transform:rotate(3deg)}}
.food3d:active .fe{transform:scale(1.12)}
.food3d.swiping{transition:none;z-index:4}
.food3d[data-dir]::before{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;color:#fff}
.food3d[data-dir="ate"]::before{content:"Ate it";background:var(--ok)}
.food3d[data-dir="toss"]::before{content:"Tossed";background:var(--bad)}
.empty-shelf{font-size:12.5px;color:#9c96aa;font-weight:700;align-self:center;padding:0 6px}
.banner{margin:2px 12px 6px;padding:9px 12px;border-radius:14px;background:#fff3cc;color:#5a4610;font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner button{border:0;background:none;text-decoration:underline;font-weight:700;padding:0;color:inherit}

/* dock */
.dock{display:flex;flex-direction:column;gap:8px;padding:10px 0 12px;position:relative;z-index:2}
.dock-row{display:flex;gap:8px;align-items:stretch;min-width:0}
.usual{flex:1;min-width:0;border:0;border-radius:20px;background:var(--tile);padding:9px 10px 9px 12px;text-align:left;box-shadow:0 3px 0 var(--shadow-2),0 8px 16px -10px var(--shadow);display:flex;align-items:center;gap:10px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.usual:active{transform:scale(.97)}
.usual .u-e{font-size:24px;flex:none}
.usual .u-txt{flex:1;min-width:0}
.usual small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:700}
.usual b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usual .u-k{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.usual .u-plus{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.log-btn{border:0;border-radius:16px;background:var(--btn-bg);color:var(--btn-fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:16px;letter-spacing:-.01em;padding:0 20px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .15s ease,opacity .15s;box-shadow:0 6px 14px -8px rgba(0,0,0,.45)}
.log-btn:active{transform:scale(.95)}
.log-btn svg.i{stroke-width:2.2;width:16px;height:16px}

/* controls */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;letter-spacing:-.01em;background:var(--ink);color:var(--sheet);display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:10px}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff}
.btn.good{background:var(--ok);color:#fff}
.btn.danger{background:var(--c-red);color:var(--c-red-i)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.inp{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;background:var(--field);font-family:inherit;color:var(--ink);min-width:0}
.inp:focus{outline:none;border-color:var(--accent)}
select.inp{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
label.lbl{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink-2)} .tiny{font-size:12.5px}
.section-t{font-size:13px;font-weight:500;color:var(--ink-2);margin:10px 4px -6px;text-transform:uppercase;letter-spacing:.02em}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,460px);max-height:92%;transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.25,1.25,.4,1);z-index:20;background:var(--sheet);border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px var(--shadow);color:var(--ink);box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:translate(-50%,0)}
.sh-head{display:flex;align-items:center;gap:10px;padding:20px 18px 12px;position:relative}
.sh-head::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:5px;background:var(--line)}
.sh-emo{display:none}
.sh-head h2{margin:0;flex:1;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.close-x{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;color:var(--ink-2)}
.sh-body{overflow:auto;padding:2px 18px 26px;overscroll-behavior:contain}
.card{background:var(--soft);border-radius:12px;padding:12px 14px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:7px 4px;font-weight:500;font-size:13px;color:var(--ink-2);transition:background .2s}
.seg button.on{background:var(--tile);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:14px;padding:20px 12px;text-align:center;cursor:pointer;color:var(--ink)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop svg.i{width:30px;height:30px;color:var(--accent)}
.preview{width:100%;max-height:200px;object-fit:contain;border-radius:16px;background:var(--soft)}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.err{background:var(--c-red);color:var(--c-red-i);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700}
.note-box{background:var(--c-amber);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:600}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:.5px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.li .main small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600}
.li .num{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.sugg-btn{width:100%;border:0;background:none;padding:0;text-align:left;display:flex;align-items:center;gap:10px}
.sugg-btn:active .add-circle{transform:scale(1.2)}
.add-circle{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:transform .2s cubic-bezier(.3,1.8,.5,1),background .2s}
.add-circle svg.i{stroke-width:3}
.add-circle.done{background:var(--ok)}
.x-btn{border:0;background:var(--soft);width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ink-2)}
.x-btn svg.i{width:13px;height:13px}
.why-tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--c-violet-i);background:var(--c-violet);border-radius:999px;padding:1px 8px;margin-right:4px}

.parse-row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:10px 0;border-bottom:.5px solid var(--line)}
.parse-row .fields{display:grid;grid-template-columns:1fr 64px;gap:6px;min-width:0}
.parse-row .sub{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;grid-column:1 / -1}
.parse-row .inp{padding:8px 9px;font-size:14px;border-radius:11px}
.parse-row.off .fields{opacity:.4}
.tick{width:22px;height:22px;margin-top:7px;accent-color:var(--ok)}
.mini-lbl{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:2px}

.item-hero{display:flex;align-items:center;gap:12px}
.item-hero .emo{width:60px;height:60px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:34px;flex:none}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.ok{background:var(--c-green);color:var(--c-green-i)} .pill.warn{background:var(--c-amber);color:var(--c-amber-i)} .pill.bad{background:var(--c-red);color:var(--c-red-i)} .pill.muted{background:var(--soft);color:var(--ink-2)}
.timeline{display:flex;align-items:center;margin:8px 0 4px}
.tl-pt{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;font-size:11.5px;color:var(--ink-2);text-align:center;width:66px;font-weight:700}
.tl-pt i{width:11px;height:11px;border-radius:50%;background:var(--ink-2);display:block}
.tl-pt.now i{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-bar{flex:1;height:4px;border-radius:4px;background:var(--line);margin-bottom:22px;position:relative;overflow:hidden}
.tl-bar span{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-weight:600;font-size:18px}
.stepper output{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.food{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--soft);padding:3px 9px 3px 3px;font-size:13.5px;font-weight:700;max-width:100%;min-width:0}
.food .emo{width:28px;height:28px;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-size:16px;flex:none}
.food .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.recipe{background:var(--soft);border-radius:18px;overflow:hidden}
.recipe .r-top{border:0;background:none;width:100%;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.recipe h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:700}
.uses{display:flex;flex-wrap:wrap;gap:5px;font-size:12px;font-weight:700}
.uses span{border-radius:999px;padding:2px 8px;background:var(--c-green);color:var(--c-green-i)}
.uses span.soon{background:var(--c-amber);color:var(--c-amber-i)}
.uses span.buy{background:var(--tile);color:var(--ink-2)}
.r-more{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.r-more ol,.r-more ul{margin:4px 0 0;padding-left:20px;line-height:1.5}
.why{font-size:13px;color:var(--ink-2)}
.cook-box{background:var(--tile);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cb-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.cb-row input{width:20px;height:20px;accent-color:var(--ok);flex:none}

.big-ring{display:flex;align-items:center;gap:16px}
.big-ring svg{width:112px;height:112px;flex:none}
.ring-bg{fill:none;stroke:var(--soft)} .ring-fg{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s} .ring-fg.over{stroke:var(--bad)}
.bar{height:9px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--m-lilac);border-radius:9px}
.chart{width:100%;height:auto;display:block}
.chart .c-bar{fill:var(--m-sky)} .chart .c-bar.over{fill:var(--m-tomato)} .chart .c-bar.today{fill:var(--m-butter)}
.chart .c-target{stroke:var(--ink-2);stroke-dasharray:4 4;stroke-width:1.2}
.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--f);font-weight:700}

.big-chk{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--line);background:var(--field);font-weight:600;font-size:13px;flex:none;display:grid;place-items:center;padding:0;color:var(--ink);transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.big-chk:active{transform:scale(.9)}
.big-chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.big-chk.auto{border-style:dashed;cursor:default}
.big-chk svg.i{width:18px;height:18px;stroke-width:3.2}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--ok)}
.dots i.today{outline:1.5px solid var(--ink-2);outline-offset:1px}

.have{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.have.yes{background:var(--c-green)} .have.no{background:var(--soft)}
.have h4{margin:0;font-size:15px;font-weight:600}
.have ul{margin:0;padding-left:18px;font-size:13.5px;font-weight:600}
.home-tag{font-size:11.5px;font-weight:600;background:var(--c-amber);color:var(--c-amber-i);padding:2px 8px;border-radius:999px;white-space:nowrap}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset button{border:0;background:var(--soft);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13.5px}
.chipset button small{color:var(--ink-2);margin-left:4px}

.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .card b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .card span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.north{background:var(--c-green);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.north b{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--c-green-i)}
.north p{margin:0;font-weight:600;font-size:14px}
.north small{display:block;font-weight:600;color:var(--ink-2);font-size:12.5px}
.pattern{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:.5px solid var(--line)}
.pattern:last-child{border-bottom:0}
.pattern b{display:block;font-weight:600;font-size:14.5px}
.pattern small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px;font-weight:600}
.ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.ic svg.i{width:16px;height:16px}
.ic.red{background:var(--c-red);color:var(--c-red-i)} .ic.amber{background:var(--c-amber);color:var(--c-amber-i)} .ic.green{background:var(--c-green);color:var(--c-green-i)}
.ic.blue{background:var(--c-blue);color:var(--c-blue-i)} .ic.violet{background:var(--c-violet);color:var(--c-violet-i)} .ic.pink{background:var(--c-pink);color:var(--c-pink-i)}

.switch{position:relative;width:50px;height:30px;border-radius:999px;border:0;background:var(--line);padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .25s cubic-bezier(.3,1.6,.5,1);box-shadow:0 1px 3px var(--shadow)}
.switch.on{background:var(--ok)} .switch.on::after{left:23px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px) scale(.95);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.3,1.5,.5,1);background:var(--ink);color:var(--sheet);padding:10px 10px 10px 16px;border-radius:16px;font-weight:700;font-size:14px;z-index:40;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-sizing:border-box;box-shadow:0 8px 20px var(--shadow)}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--accent);padding:4px 8px;font-weight:700;font-size:14px}
.confetti{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:50}

@media (prefers-reduced-motion: reduce){.door,.sheet,.magnet,.toast,.backdrop,.food3d{transition:none!important}.comp.open .door{animation:none;transform:rotateY(105deg)}.comp.closing .door{animation:none}.food3d.soon .fe,.hint-bubble{animation:none}}

/* PM additions */
.card .btn.soft{background:var(--tile)}
.check-pill{position:relative;align-self:flex-start;margin-top:-2px;border:0;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 8px;animation:pulse 2s ease-in-out infinite;z-index:3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,88,74,.45)}50%{box-shadow:0 0 0 6px rgba(240,88,74,0)}}
.check-dots{display:flex;gap:6px;justify-content:center}
.check-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block;transition:all .3s}
.check-dots i.done{background:var(--ok)} .check-dots i.now{width:22px;border-radius:8px;background:var(--accent)}
.check-card{background:var(--soft);border-radius:24px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .3s ease-in,opacity .3s}
.check-card .big{font-size:68px;line-height:1.1;animation:wiggle 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.check-card h3{margin:0;font-size:20px;font-weight:700}
.check-card p{margin:0}
.check-card.fly-r{transform:translateX(120%) rotate(18deg);opacity:0} .check-card.fly-l{transform:translateX(-120%) rotate(-18deg);opacity:0} .check-card.fly-u{transform:translateY(-40px) scale(.9);opacity:0}
.ob-list{display:flex;flex-direction:column;gap:10px}
.ob-row{display:flex;gap:12px;align-items:center}
.ob-row b{display:block;font-weight:600;font-size:14.5px}
.ob-row small{display:block;color:var(--ink-2);font-size:12.5px;font-weight:600}
.ob-emo{font-size:24px;width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.goal{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--field);text-align:left;width:100%;transition:all .2s}
.goal b{flex:1;font-weight:600;font-size:14.5px}
.goal.on{border-color:var(--accent);background:var(--accent-soft)}
.goal-tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.goal.on .goal-tick{background:var(--accent);border-color:var(--accent)}
.goal-tick svg.i{width:14px;height:14px;stroke-width:3}
.goal.start{align-items:flex-start}
.goal.start div{flex:1} .goal.start b{display:block} .goal.start small{display:block;color:var(--ink-2);font-weight:600;font-size:12.5px;margin-top:2px}
.chipset button.on{background:var(--accent);color:#fff}
.delta{font-size:11.5px;font-weight:700;white-space:nowrap}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.mt-wrap{overflow-x:auto}
.mtable{width:100%;border-collapse:collapse;font-size:13.5px}
.mtable th{text-align:left;font-size:11.5px;color:var(--ink-2);font-weight:600;padding:6px 6px 6px 0;border-bottom:.5px solid var(--line)}
.mtable td{padding:9px 6px 9px 0;border-bottom:1px solid var(--line);vertical-align:top;font-weight:600}
.mtable td:nth-child(2){white-space:nowrap;font-variant-numeric:tabular-nums}
.mtable .mhead td{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--c-violet-i);padding-top:14px;border-bottom:0}

.raw-line{grid-column:1 / -1;display:flex;align-items:center;gap:6px;min-width:0}
.raw-line code{font:600 11px ui-monospace,Menlo,monospace;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tag{font-size:10.5px;font-weight:600;border-radius:999px;padding:1px 7px;white-space:nowrap;flex:none}
.tag.learn{background:var(--c-violet);color:var(--c-violet-i)} .tag.warn{background:var(--c-amber);color:var(--c-amber-i)} .tag.info{background:var(--c-green);color:var(--c-green-i)}
.ocr-raw{white-space:pre-wrap;font:11px/1.45 ui-monospace,Menlo,monospace;background:var(--soft);border-radius:12px;padding:10px;max-height:220px;overflow:auto;margin:6px 0 0}
.used-card{background:var(--c-green);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.used-card b{font-weight:600} .used-card small{color:var(--ink-2);font-weight:600;font-size:12.5px;margin-top:-4px}
.used-card .chipset button{background:var(--tile)} .used-card .chipset button.on{background:var(--ok);color:#fff}
.learn-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.learn-card{min-width:0;background:var(--soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.learn-card>b{font-weight:600;font-size:14px}
.learn-card>small{color:var(--ink-2);font-weight:600;font-size:12.5px}
.lr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;font-size:13px;font-weight:600;min-width:0}
.lr>span:first-child,.lr code{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr>span:last-child{text-align:right;overflow-wrap:anywhere}
.lr code{font:600 11.5px ui-monospace,Menlo,monospace;color:var(--ink-2)}

/* quick add / ask */
.askbar{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;border-radius:18px;background:var(--tile);color:var(--ink-2);padding:12px 14px;font-size:15px;font-weight:600;text-align:left;box-shadow:0 3px 0 var(--shadow-2),0 8px 16px -10px var(--shadow)}
.askbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.askbar.inline{box-shadow:none;background:var(--soft);font-size:13.5px;padding:11px 12px}
.qcam{width:48px;flex:none;border-radius:18px;background:var(--tile);display:grid;place-items:center;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--shadow-2),0 8px 16px -10px var(--shadow)}
.qcam svg.i{width:21px;height:21px}
.qbar{display:flex;gap:8px;align-items:stretch}
.qbar .qcam{box-shadow:none;background:var(--soft);width:50px}
.qinput{flex:1;min-width:0;box-sizing:border-box;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--field);font:600 16px/1.35 var(--f);color:var(--ink);resize:none;overflow:hidden;min-height:50px}
.qinput:focus{outline:none;border-color:var(--accent)}
#qBody{display:flex;flex-direction:column;gap:12px}
.qlist{display:flex;flex-direction:column;gap:8px}
.qitem{background:var(--soft);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qtop{display:flex;align-items:center;gap:8px;min-width:0}
.qtop b{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qemo{font-size:22px;flex:none}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:0;border-radius:999px;background:var(--tile);color:var(--ink);padding:6px 10px;font-weight:700;font-size:12.5px;white-space:nowrap;transition:background .15s,transform .15s}
.cats button:active{transform:scale(.95)}
.cats button.on{background:var(--ink);color:var(--sheet)}
.cats.wide{grid-column:1 / -1}
.parse-row .cats button{background:var(--soft)}
.parse-row .cats button.on{background:var(--ink);color:var(--sheet)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumbs img{height:150px;width:auto;max-width:none;border-radius:12px;background:var(--soft);flex:none}
.answer{background:var(--c-violet);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.answer .q-asked{font-size:12.5px;font-weight:600;color:var(--c-violet-i)}
.answer p{margin:0;font-weight:600;font-size:14.5px;line-height:1.45}
.answer small{color:var(--ink-2);font-weight:600;font-size:12px}

/* energy & lookup */
.energy-hero{background:var(--soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.energy-hero p{margin:0;font-size:14px;font-weight:600;line-height:1.4}
.e3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.e3 span{display:block;font-size:12px;font-weight:700;color:var(--ink-2)}
.e3 b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ebar{position:relative;height:12px;border-radius:12px;background:var(--line);overflow:visible}
.ebar .eaten{position:absolute;inset:0 auto 0 0;border-radius:12px;background:var(--accent)}
.ebar i{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.macros{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;align-items:end}
.macros span{display:block;font-size:12px;font-weight:700;color:var(--ink-2)}
.macros b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:4px}
.chart .d-bar.pos{fill:var(--ok);opacity:.55} .chart .d-bar.neg{fill:var(--bad);opacity:.6} .chart .d-bar.today{opacity:1}
.chart .axis-note{font-size:10px}
.howto{margin:8px 0 0;padding-left:18px;line-height:1.5;font-weight:600;color:var(--ink)}
.howto code{font:700 12px ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 4px;border-radius:4px}
.calc{display:flex;flex-direction:column;gap:6px;margin-top:8px;color:var(--ink)}
#mag-cal small.steps{display:block;margin-top:2px;font-size:10px;opacity:.85;text-transform:none;letter-spacing:0}
.builder{background:var(--soft);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.builder .cats button{background:var(--tile)} .builder .cats button.on{background:var(--ink);color:var(--sheet)}
.build-total{display:flex;flex-direction:column;gap:2px;background:var(--tile);border-radius:14px;padding:10px 12px}
.build-total b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.build-total span{font-size:13px;font-weight:700;color:var(--ink-2)}
.build-total small{font-size:11.5px;color:var(--ink-2);font-weight:600}
.build-cta,.intent{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;background:var(--c-green);padding:12px 14px;text-align:left;color:var(--ink)}
.build-cta>span,.intent>span{font-size:26px;flex:none}
.build-cta div,.intent div{flex:1;min-width:0}
.build-cta b,.intent b{display:block;font-weight:600;font-size:14.5px}
.build-cta small,.intent small{display:block;color:var(--ink-2);font-weight:600;font-size:12.5px}
.build-cta svg.i,.intent svg.i{color:var(--c-green-i);width:22px;height:22px;stroke-width:2.6}
.tips{display:grid;gap:8px}
.tips div{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:13.5px}
.tips b{font-weight:600}
.tips span{display:block;color:var(--ink-2);font-size:12px;font-weight:600}

/* fitness & summary */
.rg-bg{opacity:.18} .rg{transition:stroke-dashoffset .8s cubic-bezier(.3,1.2,.5,1)}
.r-steps{stroke:#2fb36d} .r-move{stroke:#ff7a6b} .r-week{stroke:#6a8cff}
.rings-legend i.r-steps{background:#2fb36d} .rings-legend i.r-move{background:#ff7a6b} .rings-legend i.r-week{background:#6a8cff}
.rings-card{display:flex;align-items:center;gap:16px;background:var(--soft);border-radius:20px;padding:14px}
.rings-card svg{flex:none}
.rings-legend{display:flex;flex-direction:column;gap:8px;min-width:0}
.rings-legend div{display:grid;grid-template-columns:12px auto;column-gap:8px;align-items:baseline}
.rings-legend i{width:10px;height:10px;border-radius:50%;display:block;grid-row:span 2;align-self:center}
.rings-legend b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.rings-legend span{grid-column:2;font-size:12px;color:var(--ink-2);font-weight:600}
.goal-chip{border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;background:var(--soft)}
.goal-chip.done{background:var(--c-green);color:var(--c-green-i)}
.type-goals{display:grid;grid-template-columns:1fr;gap:6px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--tile);border-radius:12px;padding:5px 6px 5px 10px;font-size:13px;font-weight:700;min-width:0}
.tg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tg.on{outline:2px solid var(--ok)}
.stepper.sm button{width:26px;height:26px;font-size:15px}
.stepper.sm output{min-width:18px;font-size:13px}
.big-num{font-size:22px;font-weight:700;padding:6px 0}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:inherit}
.chart .s-bar{fill:var(--c-blue-i);opacity:.45} .chart .s-bar.hit{fill:var(--ok);opacity:.7} .chart .s-bar.today{opacity:1}
.act-row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;background:var(--soft);padding:10px 14px;text-align:left}
.act-row div{flex:1;min-width:0} .act-row b{display:block;font-weight:600;font-size:14.5px} .act-row small{display:block;color:var(--ink-2);font-weight:600;font-size:12.5px}
.act-rings{flex:none;display:grid}
.sum-hero{background:linear-gradient(160deg,var(--c-violet),var(--c-blue));border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px}
.sum-date{font-size:12.5px;font-weight:600;color:var(--c-violet-i)}
.sum-hero h3{margin:0;font-size:19px;font-weight:700;line-height:1.3;text-wrap:balance}
.sum-top{display:flex;align-items:center;gap:16px}
.sum-score b{display:block;font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sum-score span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.sum-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink-2);font-weight:700;flex:none}
.sum-ic.ok{background:var(--ok);color:#fff}
.sum-ic svg.i{width:16px;height:16px;stroke-width:3}
.e3.card{padding:12px}

/* calorie budget */
.budget{background:var(--soft);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.bud-head span{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.bud-head b{display:block;font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bud-head small{font-size:17px;font-weight:600;color:var(--ink-2)}
.bud-bar{height:12px;border-radius:12px;background:var(--line);overflow:hidden}
.bud-bar span{display:block;height:100%;border-radius:12px;background:var(--accent);transition:width .6s}
.bud-bar span.over{background:var(--bad)}
.bud-eq{display:flex;align-items:flex-start;justify-content:space-between;gap:2px;text-align:center}
.bud-eq>div{flex:1;min-width:0}
.bud-eq b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.bud-eq span{display:block;font-size:11px;font-weight:700;color:var(--ink-2);line-height:1.2}
.bud-eq i{font-style:normal;font-weight:700;color:var(--ink-2);padding-top:1px;font-size:16px}
.bud-def{font-size:12.5px;font-weight:600;border-top:1.5px solid var(--line);padding-top:10px}
.bud-note{margin:0;font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.4}
/* ===== "a match made in print" — zine edition, after the nepo baby pitch ===== */
:root{
  color-scheme:light;
  --wall-1:#fff4e6; --wall-2:#fff4e6; --ink:#1c0b0d; --ink-2:#6e5558; --line:#efd9cd; --soft:#fde8e6; --tile:#fffdf8; --sheet:#fffaf2; --field:#fffdf8; --paper:#fffdf8;
  --btn-bg:#1c0b0d; --btn-fg:#fff8ee; --accent:#d7141d; --accent-soft:#ffd6e3;
  --red:#d7141d; --red-t:#d7141d; --hot:#ff4fa3; --pink:#ffd3e6; --yellow:#ffe23d; --green:#def3cf; --green-i:#2f7d32; --edge:#ead7ca; --dash:#f3a3c4;
  --m-butter:#ffe23d; --m-pink:#ff9ccb; --m-mint:#bfe8a6; --m-peach:#ffb48a; --m-sky:#a9d4ff; --m-lilac:#d6c2ff; --m-tomato:#ff6b6b;
  --c-green-i:#2f7d32; --t-ok:#2f7d32;
  --soft-sh:0 1px 2px rgba(70,20,25,.06),0 10px 24px -16px rgba(70,20,25,.35); --hs:0 1px 2px rgba(70,20,25,.06),0 10px 24px -16px rgba(70,20,25,.35); --on-wall:#1c0b0d; --on-wall-2:#6e5558; --wall-dot:color-mix(in srgb,#ff4fa3 16%,transparent); --ptitle:#d7141d;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif; --fr:var(--f);
  --fa:ui-serif,"New York","Iowan Old Style",Georgia,serif; --fs:ui-serif,"New York","Iowan Old Style",Georgia,serif; --fm:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --me:#d7141d; --me-ink:#c2127f; --spring:cubic-bezier(.34,1.56,.64,1);
}
body{background:var(--wall-1) radial-gradient(circle,var(--wall-dot) 1px,transparent 1.5px) 0 0/18px 18px;color:var(--on-wall);font-family:var(--f)}
button,input,textarea,select{font-family:var(--f)}
.app{padding-inline:0}
.script{font-family:var(--fs);font-style:italic;font-weight:400}
.t-ok{color:var(--green-i) !important}

/* masthead */
.topbar{position:relative;background:var(--red);color:#fff4e6;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;align-items:center;border-radius:0 0 22px 22px;overflow:hidden}
.mast{display:flex;flex-direction:column;line-height:1}
.mast .script{font-size:15px;color:#ffd3e6;margin-bottom:2px;display:inline-block}
.topbar h1{font-family:var(--fa);font-weight:600;font-size:30px;color:#fff6dc;line-height:1.05;letter-spacing:-.01em}
.topbar .sub{color:#ffe9ee;font-weight:500;font-size:12.5px;margin-top:4px}
.topbar .icon-btn{background:rgba(255,244,230,.16);color:#fff6dc;border:0;box-shadow:none;position:relative;z-index:1}
.star{display:none;position:absolute;color:var(--yellow);pointer-events:none;animation:wig 3s ease-in-out infinite}
.star.s1{right:72px;top:8px;font-size:26px}
.star.s2{right:132px;bottom:6px;font-size:16px;animation-delay:-1.4s}
@keyframes wig{0%,100%{transform:none scale(1)}50%{transform:none scale(1.12)}}

/* tabs: oval stickers */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:12px 16px 4px;padding:3px;background:#f6e3d8;border-radius:14px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#8a6a68;font-size:11.5px;font-weight:600;padding:6px 2px 5px;border-radius:11px;position:relative;transition:transform .3s var(--spring),box-shadow .2s;min-width:0}
.tabbar button:nth-child(odd){transform:none}.tabbar button:nth-child(even){transform:none}
.tabbar button > span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tb-ic{position:relative;display:grid;place-items:center}
.tabbar svg.i{width:18px;height:18px;stroke-width:1.9}
.tabbar button.on{background:#fffdf8;color:var(--red);box-shadow:0 1px 3px rgba(70,20,25,.14)}
.tabbar button:active{transform:scale(.93)}
.tabbar i{position:absolute;top:-6px;right:-11px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;border:0;font-style:normal;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;box-sizing:border-box}

/* calorie receipt */
#budgetStrip{padding:8px 16px 2px;display:flex;flex-direction:column;gap:8px}
#budgetStrip[hidden]{display:none}
.receipt{position:relative;display:block;width:100%;border:0;background:var(--paper);color:var(--ink);text-align:left;padding:8px 13px 10px;margin-bottom:8px;transform:none;filter:drop-shadow(0 6px 10px rgba(70,20,25,.10))}
.receipt.fresh{animation:print .6s ease-out}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/14px 8px repeat-x,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/14px 8px repeat-x}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:none translateY(-8px)}to{clip-path:inset(0 0 -20px 0)}}
.rc-top{display:flex;justify-content:space-between;font-family:var(--fm);font-size:10px;letter-spacing:.12em;color:var(--ink-2);padding-bottom:6px;border-bottom:1.5px dashed var(--dash)}
.rc-top span:first-child{color:var(--red-t);font-weight:600}
.rc-body{display:flex;align-items:center;gap:14px;padding-top:6px}
.rc-main{display:flex;flex-direction:column;min-width:0}
.rc-main b{font-family:var(--fa);font-weight:600;font-size:40px;line-height:1;color:var(--red-t);font-variant-numeric:tabular-nums}
.rc-main b.over{color:#b8125f}
.rc-main .script{font-size:15px;color:#b8125f;margin-top:-2px}
.rc-lines{flex:1;display:flex;flex-direction:column;gap:2px;font-family:var(--fm);font-size:11.5px;min-width:0}
.rc-lines p{margin:0;display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.rc-lines i{flex:1;border-bottom:1.5px dotted var(--line);transform:translateY(-3px)}
.rc-lines b{font-weight:600}
.rc-lines .muted{color:var(--ink-2)}
.rc-lines .ok b{color:var(--green-i)}
.rc-bar{height:6px;border:0;border-radius:6px;overflow:hidden;margin-top:8px;background:#f6e3d8}
.rc-bar i{display:block;height:100%;border-radius:6px;background:var(--red);transition:width .9s var(--spring)}
.rc-bar i.over{background:#8a0f16}
.receipt.plain .rc-main{padding:6px 0}

/* goals row */
.goalsrow{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;width:100%;text-align:left;color:var(--on-wall);min-width:0}
.burst{flex:none;min-width:54px;height:54px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fffdf8;color:var(--ink);box-shadow:inset 0 0 0 3px #ffd84d,var(--soft-sh)}
.burst b{font-family:var(--fa);font-weight:600;font-size:17px;line-height:1}
.burst small{font-size:10px;font-weight:500;color:var(--ink-2)}
.burst.all{background:#fff0b3}
.gchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding:4px 2px;mask-image:linear-gradient(90deg,#000 85%,transparent)}
.gchips::-webkit-scrollbar{display:none}
.gc{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--tile);border:1px solid var(--edge);border-radius:999px;padding:4px 10px 4px 5px}
.gc i{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--hot) var(--p),var(--soft) 0);display:block;border:1px solid var(--edge)}
.gc.ok{background:#fff0b3;color:#1c0b0d}
.gc svg.i{width:14px;height:14px;stroke-width:3}
.gc.pop{animation:gpop .6s var(--spring)}
@keyframes gpop{40%{transform:scale(1.25) rotate(-6deg)}}

#pane{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px 18px}
#pane.enter > *{animation:paneIn .4s var(--spring)}
@keyframes paneIn{from{opacity:0;transform:translateY(12px) rotate(-.6deg)}}

/* stickers */
.sticker{display:inline-grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--c,var(--m-butter)) 55%,#fffdf8);border:0;color:#1c0b0d;line-height:1;transform:none}
.sticker .doo{width:74%;height:74%}
.chipbtn .doo{width:20px;height:20px;flex:none}
.sticker.big{width:46px;height:46px;border-radius:50%}
.sticker.sm{width:28px;height:28px;font-size:14px}
.c-peach{--c:var(--m-peach)}.c-sky{--c:var(--m-sky)}.c-mint{--c:var(--m-mint)}.c-pink{--c:var(--m-pink)}.c-butter{--c:var(--m-butter)}.c-lilac{--c:var(--m-lilac)}.c-tomato{--c:var(--m-tomato)}
.sticker.c-peach,.sticker.c-sky,.sticker.c-mint,.sticker.c-pink,.sticker.c-butter,.sticker.c-lilac,.sticker.c-tomato{background:color-mix(in srgb,var(--c) 55%,#fffdf8)}


/* chat */
.feed{display:flex;flex-direction:column;gap:12px;padding:4px 0 6px}
.daysep{align-self:center;margin:6px 0 0}
.daysep span{font-family:var(--fs);font-style:italic;font-size:18px;color:var(--ptitle);line-height:1}
.msg{display:flex}
.msg.new{animation:msgIn .5s var(--spring) both}
.msg.me.new{transform-origin:right bottom}.msg.bot.new{transform-origin:left bottom}
@keyframes msgIn{from{opacity:0;transform:translateY(16px) scale(.9) rotate(-2deg)}}
.msg.me{justify-content:flex-end}
.msg .bub{max-width:82%;background:var(--me);color:#fff;padding:9px 14px;border-radius:20px 20px 4px 20px;font-size:15.5px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.imgtag{display:inline-flex;align-items:center;gap:4px;font-size:12px;opacity:.9;margin-right:6px}
.imgtag svg.i{width:13px;height:13px}
.msg.bot .card{width:92%;max-width:92%;box-sizing:border-box;background:var(--paper);border:1px solid var(--edge);border-radius:16px 16px 16px 4px;padding:12px 13px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--soft-sh)}
.msg.bot .card.undone{opacity:.5;box-shadow:none}
.msg.bot .card.undone .bc{text-decoration:line-through}
.said{white-space:pre-line;margin:0;font-size:15px;line-height:1.4;-webkit-user-select:text;user-select:text}
.blk{display:flex;gap:11px;align-items:flex-start;padding-top:10px;border-top:1.5px dashed var(--dash)}
.said + .blk,.card > .blk:first-child{border-top:0;padding-top:0}
.blk .sticker{margin-top:2px}
.msg.new .blk .sticker{animation:stk .6s var(--spring) .15s both}
@keyframes stk{from{transform:scale(0) rotate(-60deg)}}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bh .btag{flex-basis:100%;font-family:var(--fa);font-weight:600;font-size:13px;color:var(--red-t)}
.btag .via{font-family:var(--fr);font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;color:#1c0b0d;background:var(--m-sky);border:1px solid var(--edge);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:2px}
.bh b{flex:1;font-size:15.5px;font-weight:600;min-width:0}
.bh strong{font-family:var(--fa);font-weight:600;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.bh strong small{font-family:var(--fr);font-size:12px;font-weight:500;color:var(--ink-2)}
.macros{display:flex;gap:5px;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.macros span{border:1px solid var(--edge);border-radius:999px;padding:1px 8px;background:var(--tile)}
.macros .mp{background:var(--m-pink);color:#1c0b0d}
.items{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;font-family:var(--fm);font-size:12.5px}
.items li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed var(--line)}
.items li:first-child{border-top:0}
.items li span{min-width:0;font-family:var(--fr);font-size:14px}
.items li em{font-style:normal;color:var(--ink-2)}
.items li small{display:block;color:var(--ink-2);font-size:12px}
.items li b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bnote{margin:0;font-size:12.5px;color:var(--ink-2)}
.names{margin:0;font-size:14.5px;font-weight:500}
.useq{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--edge);border-radius:12px;padding:8px 10px;font-size:13px}
.useq.pat{background:#fff0b3;color:#1c0b0d}
.useq.pat .linkbtn{color:#1c0b0d;text-decoration:underline}
.bact{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:2px}
.mfoot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2);padding-top:2px}
.mfoot .left{font-family:var(--fs);font-style:italic;font-size:14px;color:#b8125f;line-height:1}
.mfoot .left.over{color:var(--red-t)}
.linkbtn{border:0;background:none;color:var(--me-ink);font-weight:600;font-size:13.5px;padding:2px 0}
.linkbtn.danger{color:var(--red-t)}
.pillbtn{border:0;background:var(--red);color:#fff;font-weight:600;font-size:13.5px;padding:6px 14px;border-radius:999px;transition:transform .2s var(--spring)}
.pillbtn.sm{padding:4px 12px;font-size:12.5px;margin-top:6px;align-self:flex-start}
.pillbtn:active,.chipbtn:active,.ex button:active,.qchips button:active{transform:scale(.94) rotate(-2deg)}
.idea{flex-direction:column;gap:4px}
.idea .ihead{border:1px solid var(--edge);background:#f6efff;border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;color:#1c0b0d;width:100%}
.idea .ihead b{font-size:15px;font-weight:600}
.idea .ihead small{font-size:12.5px;opacity:.85}
.idea .ibody{padding:0 4px}
.idea .ibody ul,.idea .ibody ol{margin:6px 0;padding-left:20px;font-size:14px;line-height:1.45}
.typing{flex-direction:row !important;align-items:center;justify-content:space-between;width:auto !important;max-width:200px !important}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;border:1px solid var(--edge);animation:hop 1s infinite var(--spring)}
.dots i:nth-child(1){background:var(--red)}.dots i:nth-child(2){background:var(--hot);animation-delay:.15s}.dots i:nth-child(3){background:var(--yellow);animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-7px)}}
.hello{padding:8px 2px}
.hello-stk{display:flex;gap:10px;margin-bottom:10px}
.hello-stk .sticker:nth-child(1){--rot:-10deg}.hello-stk .sticker:nth-child(2){--rot:8deg}.hello-stk .sticker:nth-child(3){--rot:-4deg}
.hello-stk .sticker{animation:stk .7s var(--spring) both}.hello-stk .sticker:nth-child(2){animation-delay:.1s}.hello-stk .sticker:nth-child(3){animation-delay:.2s}
.hello h2{margin:0 0 6px;font-family:var(--fa);font-weight:600;font-size:34px;color:var(--ptitle);line-height:1}
.hello p{margin:0 0 12px;color:var(--on-wall-2);font-size:15px;line-height:1.45}
.hello .keynote{background:#fff0b3;color:#1c0b0d;border:1px solid var(--edge);border-radius:14px;padding:10px 12px;font-size:14px;box-shadow:var(--soft-sh)}
.ex{display:flex;flex-direction:column;gap:9px}
.ex button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--edge);background:var(--tile);border-radius:14px;padding:9px 12px;font-size:14px;color:var(--ink);line-height:1.35;transition:transform .2s var(--spring)}
.ex button:nth-child(odd){transform:none}.ex button:nth-child(even){transform:none}
.ex button .sticker{background:color-mix(in srgb,var(--c) 40%,#fffdf8)}

/* composer */
#composer{padding:6px 12px 10px;display:flex;flex-direction:column;gap:8px;background:var(--wall-1);border-top:1.5px dashed var(--dash)}
#composer[hidden]{display:none}
.qchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;padding:2px}
.qchips[hidden]{display:none}
.qchips::-webkit-scrollbar{display:none}
.qchips .ql{font-family:var(--fs);font-style:italic;font-size:14px;color:var(--ptitle);white-space:nowrap;padding:0 2px}
.qchips button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--edge);border-radius:999px;background:color-mix(in srgb,var(--c) 40%,#fffdf8);color:#1c0b0d;font-size:13px;font-weight:600;padding:5px 12px 5px 8px;transition:transform .2s var(--spring)}
.qchips button small{opacity:.7;font-weight:600}
.cbar{display:flex;align-items:flex-end;gap:8px}
.cbar textarea{flex:1;min-width:0;resize:none;border:1px solid var(--edge);border-radius:22px;background:var(--tile);color:var(--ink);font:inherit;font-size:16px;line-height:1.35;padding:9px 15px;max-height:140px}
.cbar textarea:focus{outline:none;box-shadow:var(--soft-sh)}
.cplus,.csend{width:42px;height:42px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;flex:none;transition:transform .3s var(--spring),background .2s;box-shadow:var(--soft-sh)}
.cplus{background:#fffdf8;color:var(--red)}
.cplus.open{transform:none}
.csend{background:var(--soft);color:var(--ink-2)}
.csend.ready{background:var(--red);color:#fff;animation:gpop .4s var(--spring)}
.csend svg.i{width:19px;height:19px;stroke-width:2.8}
.tray{display:flex;flex-direction:column;gap:7px}
.tray[hidden]{display:none}
.tray button,.tray label{display:flex;align-items:center;gap:12px;border:1px solid var(--edge);background:var(--paper);color:var(--ink);border-radius:14px;padding:9px 12px;text-align:left;color:var(--ink);cursor:pointer;animation:msgIn .35s var(--spring) both}
.tray label:nth-of-type(1){animation-delay:.04s}.tray label:nth-of-type(2){animation-delay:.08s}
.tray b{display:block;font-weight:600;font-size:14.5px}
.tray small{display:block;color:var(--ink-2);font-size:12.5px}
.attach{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.attach[hidden]{display:none}
.attach .th{position:relative}
.attach img{height:60px;border-radius:10px;display:block;border:1px solid var(--edge)}
.attach button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--edge);background:var(--red);color:#fff;display:grid;place-items:center}
.attach svg.i{width:12px;height:12px}
.impnote{font-family:var(--fs);font-style:italic;font-size:13px;color:#b8125f}
.gtitle.warn{color:var(--ptitle)}

/* panes */
.pane-in{display:flex;flex-direction:column;gap:13px;padding-top:10px}
.phead{display:flex;gap:12px;align-items:center}
.phead p{margin:3px 0 0;font-size:13.5px;color:var(--on-wall-2);line-height:1.35}
.ptitle{margin:0;font-family:var(--fa);font-weight:600;font-size:32px;color:var(--ptitle);line-height:1}
.addrow{display:flex;gap:8px}
.addrow .inp{border:1px solid var(--edge);border-radius:999px;background:var(--tile);padding-inline:16px}
.addrow .btn,.btn{border-radius:999px}
.addrow .btn{border:1px solid var(--edge)}
.row2{display:flex;gap:8px}
.chipbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--edge);border-radius:999px;background:color-mix(in srgb,var(--c) 40%,#fffdf8);color:#1c0b0d;font-weight:600;font-size:13.5px;padding:9px 10px;transition:transform .2s var(--spring)}
.chipbtn:nth-child(odd){transform:none}.chipbtn:nth-child(even){transform:none}
.chipbtn.wide{width:100%;text-align:left;padding:12px 16px;transform:none}
.gtitle{font-family:var(--fa);font-weight:600;font-size:15px;color:var(--on-wall);display:flex;justify-content:space-between;align-items:center;margin:8px 2px -4px}
.gtitle small{font-family:var(--fr);font-size:12px;font-weight:500;color:var(--on-wall-2);text-transform:none;letter-spacing:0}
.gtitle .linkbtn{font-family:var(--fr);text-transform:none;letter-spacing:0}
.gtitle.warn{color:var(--ptitle)}
.group{background:var(--paper);color:var(--ink);border:1px solid var(--edge);border-radius:16px;overflow:hidden;box-shadow:0 8px 18px -12px rgba(60,10,20,.35)}
.group.dim{opacity:.6;box-shadow:none}
.row-i,.row-l{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px 14px;color:var(--ink);border-top:1.5px dashed var(--dash);min-width:0}
.group > :first-child,.paper-receipt .pr-top + .row-l{border-top:0}
.row-i .emo{font-family:var(--fa);font-size:18px;color:#1c0b0d;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--soft);border:1px solid var(--edge);transform:none}
.row-i:nth-child(even) .emo{transform:none}
.row-i .emo.f-ok{background:var(--m-mint)}
.row-i .emo.f-warn{background:var(--m-butter)}
.row-i .emo.f-bad{background:var(--m-pink)}
.row-i .nm,.row-l .nm{flex:1;min-width:0}
.row-i b,.row-l b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.row-i b em{font-style:normal;color:var(--ink-2);font-weight:400}
.row-i small,.row-l small{display:block;font-size:12.5px;color:var(--ink-2)}
.pill{border:1px solid var(--edge)}
.tickbtn{width:26px;height:26px;border-radius:6px;border:1px solid var(--edge);background:var(--tile);flex:none;display:grid;place-items:center;padding:0;transition:transform .25s var(--spring)}
.tickbtn:active{transform:scale(.8) rotate(-10deg)}
.tickbtn.on{background:#fff0b3;color:#1c0b0d}
.tickbtn svg.i{width:14px;height:14px;stroke-width:3}
.hint,.empty{margin:0;font-size:12.5px;color:var(--on-wall-2);line-height:1.4}
.chips2{display:flex;flex-wrap:wrap;gap:7px}
.chips2 button,.chips2 span{border:1px solid var(--edge);background:color-mix(in srgb,var(--c,var(--m-mint)) 30%,#fffdf8);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:#1c0b0d;transition:transform .2s var(--spring)}
.chips2 > :nth-child(3n+1){transform:none}.chips2 > :nth-child(3n+2){transform:none}
.chips2 small{opacity:.7;margin-left:5px;font-weight:600}
.hist .hday{padding:10px 14px;border-top:1.5px dashed var(--dash)}
.hist .hday:first-child{border-top:0}
.hist .hday span{font-family:var(--fm);font-size:11px;letter-spacing:.1em;color:var(--red-t);font-weight:600}
.hist .hday p{margin:2px 0 0;font-size:14.5px}
.banner2{background:#fff0b3;color:#1c0b0d;border:1px solid var(--edge);border-radius:12px;padding:8px 12px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.banner2 .linkbtn{color:#1c0b0d;text-decoration:underline}
.emptycard{background:var(--paper);border:2px dashed var(--edge);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.emptycard p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.45}

/* shopping list as a receipt */
.paper-receipt{position:relative;background:var(--paper);padding:12px 14px 14px;margin:6px 0 10px;transform:none;filter:drop-shadow(0 6px 8px rgba(60,10,20,.14))}
.paper-receipt::before,.paper-receipt::after{content:"";position:absolute;left:0;right:0;height:8px}
.paper-receipt::before{top:-8px;background:linear-gradient(45deg,var(--paper) 50%,transparent 50%) 0 0/14px 8px repeat-x,linear-gradient(-45deg,var(--paper) 50%,transparent 50%) 0 0/14px 8px repeat-x}
.paper-receipt::after{bottom:-8px;background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/14px 8px repeat-x,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/14px 8px repeat-x}
.pr-top{text-align:center;padding-bottom:8px;border-bottom:1.5px dashed var(--dash)}
.pr-top b{display:block;font-family:var(--fa);font-weight:600;font-size:24px;color:var(--red-t);}
.pr-top span{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--ink-2)}
.paper-receipt .row-l{padding:9px 2px}
.pr-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--edge);margin-top:4px;padding-top:8px}
.pr-total b{font-family:var(--fa);font-weight:600;font-size:20px}
.pr-total .script{font-size:16px;color:var(--red-t)}
.barcode{height:30px;margin:10px auto 4px;width:70%;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px)}
.pr-thanks{margin:0;text-align:center;font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--ink-2)}

/* green flags / red flags */
.flags{display:flex;flex-direction:column;gap:10px}
.flagbox{border:1px solid var(--edge);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.flagbox.green{background:var(--green)}
.flagbox.red{background:var(--pink)}
.flagbox h3{margin:0;font-family:var(--fa);font-weight:600;font-size:18px;}
.flagbox.green h3{color:var(--green-i)}.flagbox.red h3{color:var(--red-t)}
.spot{display:flex;gap:11px;align-items:flex-start}
.spot b{display:block;font-size:14.5px;font-weight:600}
.spot small{display:block;font-size:13px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.spot > div{display:flex;flex-direction:column}

/* recipe cards, taped in */
.rcard{position:relative;background:var(--paper);border:1px solid var(--edge);border-radius:14px;box-shadow:var(--soft-sh);transform:none;margin-top:6px}
.tape{position:absolute;top:-10px;left:50%;width:74px;height:20px;margin-left:-37px;background:color-mix(in srgb,var(--hot) 45%,transparent);transform:none;border-left:2px dotted rgba(255,255,255,.6);border-right:2px dotted rgba(255,255,255,.6)}
.rhead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:14px 14px 12px;color:var(--ink)}
.rhead .sticker{background:color-mix(in srgb,var(--c) 40%,#fffdf8)}
.rhead .nm{flex:1;min-width:0}
.rhead b{display:block;font-size:16.5px;font-weight:600}
.rhead small{display:block;font-size:12.5px;color:var(--ink-2)}
.rhead small.made{font-family:var(--fs);font-style:italic;font-size:13px;color:#b8125f;line-height:1.1}
.rhead strong{text-align:right;font-family:var(--fa);font-weight:600;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.rhead strong small{font-family:var(--fr);font-size:10.5px;font-weight:600}
.rbody{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.rbody .gtitle{margin:4px 0 -2px;font-size:13px}
.steps{margin:0;padding-left:20px;font-size:14px;line-height:1.45}
.rcook{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--soft);border:1px solid var(--edge);border-radius:14px;padding:8px 10px;font-size:13.5px}
.stepper.sm button{width:30px;height:30px;font-size:16px}

/* goals sheet */
.apps{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.app-t{border:1px solid var(--edge);border-radius:14px;padding:9px 11px;background:var(--paper);transform:none;box-shadow:var(--soft-sh);display:flex;flex-direction:column}
.app-t span{font-size:20px}
.app-t b{font-size:14px;font-weight:600}
.app-t small{font-size:12px;color:var(--ink-2)}
.gweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gweek button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:14px;color:var(--ink-2)}
.gweek button.on{background:var(--soft);color:var(--ink)}
.gweek small{font-size:11.5px;font-weight:600}
.gdot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--fa);font-size:15px;background:var(--tile);border:1px solid var(--edge);color:var(--ink-2);transform:none}
.gweek button:nth-child(even) .gdot{transform:none}
.gdot.some{background:var(--m-pink);color:#1c0b0d}
.gdot.all{background:#fff0b3;color:#1c0b0d}
.gdot.none{background:transparent;border-style:dashed}
.ghead{display:flex;justify-content:space-between;align-items:baseline}
.ghead b{font-family:var(--fa);font-weight:600;font-size:24px;color:var(--red-t)}
.ghead span{font-size:13.5px;color:var(--ink-2)}
.glist{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--edge);border-radius:16px;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-top:1.5px dashed var(--dash)}
.grow:first-child{border-top:0}
.gmark{width:26px;height:26px;border-radius:6px;border:1px solid var(--edge);display:grid;place-items:center;flex:none;color:#1c0b0d;transition:transform .3s var(--spring)}
.grow.ok .gmark{background:var(--yellow);transform:none}
.grow.miss .gmark{border-color:var(--red-t)}
.gmark svg.i{width:14px;height:14px;stroke-width:3}
.grow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.grow b{font-weight:600;font-size:15px}
.grow small{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.gbar{height:7px;border-radius:7px;border:1px solid var(--edge);background:var(--tile);overflow:hidden;display:block}
.gbar i{display:block;height:100%;background:var(--hot);transition:width .6s var(--spring)}
.grow.ok .gbar i{background:repeating-linear-gradient(-45deg,var(--yellow) 0 5px,#ffcf00 5px 10px)}
.grow.miss .gbar i{background:var(--red)}

/* sheets pick up the zine look too */
.sheet{border:1px solid var(--edge);border-bottom:0}
.sh-head h2{font-family:var(--fa);font-weight:600;font-size:26px;color:var(--red-t)}
.section-t{font-family:var(--fa);font-weight:600;font-size:14px;color:var(--ink)}
.toast{border:1px solid var(--edge)}
@media (prefers-reduced-motion: reduce){.msg.new,.msg.new .blk .sticker,.hello-stk .sticker,#pane.enter > *,.tray button,.tray label,.csend.ready,.gc.pop,.star,.burst,.receipt{animation:none}.dots i{animation-duration:2s}}

/* steps + workouts strip */
.syncrow{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.sync{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px 6px 6px;text-align:left;min-width:0;transition:transform .2s var(--spring)}
.sync:active{transform:scale(.95) rotate(-1deg)}
.sync .doo{width:30px;height:30px;flex:none;background:var(--m-sky);border-radius:50%;border:1px solid var(--edge);padding:3px;box-sizing:border-box;color:#1c0b0d}
.sync.wk .doo{background:var(--m-pink)}
.sync span{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync span b{font-family:var(--fa);font-weight:600;font-size:18px;margin-right:3px}
.sync small{display:block;font-size:11px;font-weight:500;color:var(--ink-2)}
.sync em{font-style:normal;font-weight:600;font-size:16px;color:var(--red-t)}
.howto{margin:0;padding-left:20px;font-size:13.5px;line-height:1.5}
.howto code{background:var(--soft);border-radius:5px;padding:0 4px;font-size:12.5px}
.card{color:var(--ink)}
.sheet{color:var(--ink)}

.addrow .btn{background:var(--red);color:#fff;border:0}
.dots i{border:0}

.chat-tools{display:flex;justify-content:flex-end;margin-bottom:-4px}
.clearbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--edge);background:#fffdf8;color:var(--ink-2);font-size:12.5px;font-weight:600;padding:5px 11px 5px 9px;border-radius:999px}
.clearbtn svg.i{width:12px;height:12px}
.plan{display:flex;gap:12px;align-items:center;background:#fff6e0;border-radius:12px;padding:10px 12px}
.plan b{display:block;font-size:14.5px;font-weight:600}
.plan small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.plan .btn{flex:none;background:var(--red);color:#fff}

.topbar h1.brand{font-family:"Great Vibes","Snell Roundhand",cursive;font-style:normal;font-weight:400;font-size:46px;line-height:1;color:#ffe23d;letter-spacing:0;margin:2px 0 -2px}

/* Train */

.tabbar{grid-template-columns:repeat(5,1fr)}
.tabbar button{font-size:11px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{position:relative;border:1px solid var(--edge);background:#fffdf8;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;color:var(--ink)}
.week button small{font-size:10.5px;color:var(--ink-2);font-weight:600}
.week button b{font-size:10.5px;font-weight:600;line-height:1.15;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.week button.today{box-shadow:inset 0 0 0 1.5px var(--red)}
.week button.on{background:var(--red);color:#fff;border-color:var(--red)}
.week button.on small{color:#ffd9dc}
.week button.restd b{color:var(--ink-2);font-weight:500}
.week button.on.restd b{color:#ffe4e6}
.week button i{position:absolute;top:-6px;right:-4px;width:16px;height:16px;border-radius:50%;background:#2f9e5a;color:#fff;display:grid;place-items:center}
.week button i svg.i{width:10px;height:10px;stroke-width:3.4}
.daycard{background:#fffdf8;color:var(--ink);border:1px solid var(--edge);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--soft-sh)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh b{display:block;font-family:var(--fa);font-weight:600;font-size:19px}
.dh small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.mini{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:-4px}
.chips2 button.sel{background:var(--red);color:#fff;border-color:var(--red)}
.chips2.gpick button{background:#fffdf8}
.chips2.gpick button.ingrp{box-shadow:inset 0 0 0 1.5px #ffb3bd}
.chips2.gpick button.sel{background:var(--red);color:#fff}
.plan-ex{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.plan-ex b{display:block;font-size:14.5px;font-weight:600}
.plan-ex small{display:block;font-size:12.5px;color:var(--ink-2)}
.addb{width:32px;height:32px;border-radius:50%;border:1px solid var(--edge);background:#fffdf8;color:var(--red);display:grid;place-items:center;flex:none}
.addb.on{background:#2f9e5a;color:#fff;border-color:#2f9e5a}
.addb svg.i{width:15px;height:15px;stroke-width:2.6}
.sess{background:#fffdf8;color:var(--ink);border:1.5px solid var(--red);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--soft-sh)}
.sess-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sess-h b{display:block;font-family:var(--fa);font-weight:600;font-size:21px}
.sess-h small{font-size:12.5px;color:var(--ink-2)}
.rest{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;border-radius:999px;padding:5px 6px 5px 12px;font-size:13px}
.rest[hidden]{display:none}
.rest b{font-variant-numeric:tabular-nums}
.rest button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
.exc{border-top:1px dashed var(--dash);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.exc:first-of-type{border-top:0}
.exh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.exh b{font-size:15.5px;font-weight:600}
.exm{font-size:12px;color:var(--ink-2)}
.sets{display:flex;flex-direction:column;gap:5px}
.srow{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:8px;align-items:center}
.srow.hd span{font-size:11px;font-weight:600;color:var(--ink-2);text-align:center}
.srow > span{text-align:center;font-weight:600;color:var(--ink-2);font-size:13px}
.srow .inp{padding:8px 10px;text-align:center;font-variant-numeric:tabular-nums}
.srow.done .inp{background:#f1f9f3;border-color:#bfe3c9}
.srow .tickbtn{width:30px;height:30px;border-radius:8px}
.srow .tickbtn.on{background:#2f9e5a;color:#fff;border-color:#2f9e5a}
.plates{font-size:12px;color:var(--red-t)}
.fin{display:flex;gap:10px;align-items:center;border:1px solid var(--edge);background:#fff6e0;border-radius:14px;padding:10px 12px;text-align:left;color:var(--ink)}
.fin.on{background:#eef8f0}
.fin b{display:block;font-size:14px;font-weight:600}
.fin small{display:block;font-size:12px;color:var(--ink-2)}
.fin .tickbtn.on{background:#2f9e5a;color:#fff;border-color:#2f9e5a}
.finrow{display:flex;gap:10px;align-items:flex-end}
.finrow label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);font-weight:600;width:84px}
.finrow .inp{padding:9px 10px}
.finrow .btn{flex:1;background:var(--red);color:#fff}
.exl .nm small{line-height:1.35}
.daycard .btn{background:var(--red);color:#fff;border-radius:999px}

/* ===== v3 · clean & fun (Hello Dani cream + Cyber Areej red) ===== */
:root{
  --wall-1:#f7f4ec; --wall-2:#f7f4ec; --paper:#ffffff; --tile:#ffffff; --sheet:#fbf9f4; --field:#ffffff;
  --ink:#141010; --ink-2:#6f6762; --line:#e9e3d8; --edge:#e6dfd3; --soft:#f1ede4; --dash:#e7ddd0;
  --red:#d8352f; --red-t:#c42a25; --brick:#bf3f45; --blush:#ffd2d2; --maroon:#6b2a2e;
  --fa:"Libre Baskerville",ui-serif,Georgia,serif; --fs:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --soft-sh:0 1px 2px rgba(40,20,10,.04),0 12px 28px -18px rgba(40,20,10,.28);
  --ptitle:#141010; --on-wall:#141010; --on-wall-2:#6f6762; --me:#141010; --me-ink:#c42a25; --btn-bg:#141010; --btn-fg:#ffffff;
}
body{background:var(--wall-1)!important}
.script{font-style:normal}
/* header: Cyber Areej */
.topbar{background:var(--brick);border-radius:0 0 28px 28px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 16px}
.topbar h1.brand{position:relative;display:flex;align-items:center;font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,system-ui,sans-serif;font-weight:800;font-size:44px;letter-spacing:-.055em;line-height:.95;color:var(--blush);margin:0}
.topbar h1.brand span{position:relative;z-index:1}
.bstar{order:2;width:22px;height:22px;fill:#ffd2d2;margin:-18px 0 0 4px;transform:rotate(12deg);animation:bspin 6s ease-in-out infinite}@keyframes bspin{50%{transform:rotate(-10deg) scale(1.08)}}
.topbar .sub{color:#ffe3e3;opacity:.9;font-size:13px;margin-top:6px;font-weight:500}
.topbar .icon-btn{background:transparent;border:1px solid rgba(255,210,210,.7);color:var(--blush)}
/* tabs: outlined ovals, active = black pill */
.tabbar{background:none;padding:0;gap:6px;margin:14px 16px 6px}
.tabbar button{border:1px solid #d9cfc2;border-radius:999px;background:transparent;color:var(--ink);font-weight:500;font-size:11px;padding:6px 0 5px;gap:1px}
.tabbar button.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:none}
.tb-ic{font-size:16px;line-height:1.1}
.tabbar i{background:var(--red);border:2px solid var(--wall-1)}
/* type */
.ptitle,.hello h2,.dh b,.sess-h b,.ghead b,.pr-top b,.sh-head h2{font-family:var(--fa);font-weight:400;letter-spacing:-.03em;color:var(--ink)}
.ptitle{font-size:30px}
.hello h2{font-size:30px;color:var(--ink)}
.gtitle{font-family:var(--fa);font-weight:400;font-size:18px;letter-spacing:-.02em;color:var(--ink);margin:14px 2px -2px}
.gtitle.warn{color:var(--red-t)}
.section-t{font-family:var(--fa);font-weight:400;font-size:17px;letter-spacing:-.02em;color:var(--ink)}
.sh-head h2{font-size:24px}
.phead p,.hello p{color:var(--ink-2)}
/* receipt: clean, Dani card */
.receipt{background:#fff;filter:drop-shadow(0 10px 18px rgba(40,20,10,.08))}
.receipt::after{background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/14px 8px repeat-x,linear-gradient(225deg,#fff 50%,transparent 50%) 0 0/14px 8px repeat-x}
.rc-top span:first-child{color:var(--red-t)}
.rc-main b{font-family:var(--fa);font-weight:400;font-size:42px;letter-spacing:-.04em;color:var(--ink)}
.rc-main b.over{color:var(--red-t)}
.rc-main .script{font-family:var(--f);font-style:normal;font-size:12.5px;color:var(--ink-2);font-weight:500}
.rc-bar{background:#f1ede4}.rc-bar i{background:var(--ink)}.rc-bar i.over{background:var(--red)}
/* chips, pills, buttons */
.burst{box-shadow:inset 0 0 0 2px var(--ink),var(--soft-sh);background:#fff}
.burst b{font-family:var(--fa);font-weight:400}
.burst.all{background:var(--blush)}
.gc{background:#fff;border:1px solid var(--edge);font-weight:500}
.gc.ok{background:var(--ink);color:#fff;border-color:var(--ink)}
.gc i{background:conic-gradient(var(--red) var(--p),#efe7dc 0);border:0}
.btn,.pillbtn,.addrow .btn,.daycard .btn,.finrow .btn,.plan .btn{background:var(--ink);color:#fff;border:0;border-radius:999px}
.linkbtn{color:var(--red-t)}
.chipbtn{background:#fff!important;border:1px solid var(--edge);font-weight:500}
.chips2 button,.chips2 span{background:#fff!important;border:1px solid var(--edge);font-weight:500;color:var(--ink)}
.chips2 button.sel{background:var(--ink)!important;color:#fff;border-color:var(--ink)}
.chips2.gpick button.ingrp{box-shadow:inset 0 0 0 1.5px var(--blush)}
.qchips button{background:#fff;border:1px solid var(--edge);font-weight:500}
.qchips .ql{font-family:var(--f);font-style:normal;font-size:12.5px;color:var(--ink-2);font-weight:500}
/* stickers = Apple emoji in soft circles */
.sticker{background:#f3eee5!important;border:0!important;box-shadow:none!important;transform:none!important}
.sticker .emo-i{font-size:19px;line-height:1}
.sticker.big .emo-i{font-size:24px}
.sticker.big{border-radius:50%}
.chipbtn .emo-i{font-size:16px}
.sync .emo-i{width:32px;height:32px;display:grid;place-items:center;background:#f3eee5;border-radius:50%;font-size:17px;flex:none}
.sync{background:#fff;border:1px solid var(--edge)}
.sync span b{font-family:var(--fa);font-weight:400;font-size:17px}
.sync em{color:var(--ink-2)}
.row-i .emo{background:#f3eee5!important;border:0;transform:none!important;font-family:inherit;font-size:19px}
/* cards */
.group,.glist,.daycard,.rcard,.emptycard,.msg.bot .card,.paper-receipt{background:#fff;border:1px solid var(--edge)}
.msg.bot .card{box-shadow:var(--soft-sh);border-radius:20px 20px 20px 6px}
.msg .bub{background:var(--ink);color:#fff;border-radius:20px 20px 6px 20px}
.bh .btag{font-family:var(--f);font-size:12px;font-weight:600;color:var(--red-t)}
.bh strong{font-family:var(--fa);font-weight:400;font-size:21px;letter-spacing:-.03em}
.macros span{border:1px solid var(--edge);background:#fff;font-weight:500}
.macros .mp{background:var(--blush);border-color:var(--blush)}
.mfoot .left{font-family:var(--f);font-style:normal;font-size:12.5px;font-weight:600;color:var(--ink)}
.daysep span{font-family:var(--f);font-style:normal;font-size:12px;font-weight:600;color:var(--ink-2);background:#efe9de;padding:3px 10px;border-radius:999px}
.flagbox{border:1px solid var(--edge)}.flagbox h3{font-family:var(--fa);font-weight:400;letter-spacing:-.02em;font-size:17px}
.flagbox.green{background:#eef6e9}.flagbox.red{background:#fdeceb}
.rhead strong,.pr-total b{font-family:var(--fa);font-weight:400}
.rhead small.made{font-family:var(--f);font-style:normal;font-size:12px;color:var(--red-t);font-weight:500}
.pr-top b{color:var(--ink)}
.pr-total .script{font-family:var(--f);font-style:normal;font-size:13px;color:var(--ink-2);font-weight:500}
.tape{background:rgba(255,210,210,.7);border:0}
.rcard{box-shadow:var(--soft-sh)!important}
.cplus{background:#fff;color:var(--ink);border:1px solid var(--edge);box-shadow:none}
.csend{border:1px solid var(--edge);box-shadow:none}
.csend.ready{background:var(--ink);color:#fff;border-color:var(--ink)}
.cbar textarea{border:1px solid var(--edge)}
#composer{border-top:1px solid var(--line)}
.week button{border-color:var(--edge)}
.week button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.week button.today{box-shadow:inset 0 0 0 1.5px var(--red)}
.sess{border:1.5px solid var(--ink)}
.rest{background:var(--ink)}
.dots i:nth-child(1){background:var(--brick)}.dots i:nth-child(2){background:var(--blush)}.dots i:nth-child(3){background:var(--ink)}
.hello-stk .sticker{width:48px;height:48px}
.ex button{background:#fff!important;border:1px solid var(--edge)}
.ex button .sticker{background:#f3eee5!important}
.banner2{background:#fff6dc;border:1px solid #f0e2b8}
.keynote{background:#fff6dc!important;border:1px solid #f0e2b8!important;box-shadow:none!important}

/* ===== v4 · Snatched's own look (palette inspired by Dani: warm off-white + confident primaries) ===== */
:root{
  --wall-1:#f6f5f1; --wall-2:#f6f5f1; --edge:#e4e3dd; --line:#e4e3dd; --soft:#efede7;
  --tomato:#f4412e; --sky:#8bd8f2; --cobalt:#2443d6; --bubble:#ff98c8; --sun:#ffc83d;
  --red:#f4412e; --red-t:#d9301e; --blush:#ffd7e9;
  --acc:var(--sun); --acc-ink:#141010; --acc-soft:#fff3cf;
}
body[data-tab=fridge]{--acc:var(--sky);--acc-ink:#0f2a36;--acc-soft:#e3f5fc}
body[data-tab=groceries]{--acc:var(--tomato);--acc-ink:#fff;--acc-soft:#ffe4df}
body[data-tab=recipes]{--acc:var(--bubble);--acc-ink:#3b0f25;--acc-soft:#ffe6f2}
body[data-tab=train]{--acc:var(--cobalt);--acc-ink:#fff;--acc-soft:#e3e8fc}
/* header: plain cream, black wordmark, colored scalloped sticker that follows the tab */
.topbar{position:relative;background:transparent;border-radius:0;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 4px;overflow:visible}
.topbar h1.brand{font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-.05em;line-height:1;color:var(--ink);margin:0}
.topbar h1.brand span{color:var(--ink)}
.topbar .sub{color:var(--ink-2);opacity:1;font-size:13px;margin-top:5px;font-weight:500}
.bsun{position:absolute;right:6px;top:calc(2px + env(safe-area-inset-top,0px));width:76px;height:76px;fill:var(--acc);transition:fill .35s ease;animation:bsun 24s linear infinite;z-index:0}
@keyframes bsun{to{transform:rotate(360deg)}}
.topbar .icon-btn{position:relative;z-index:1;background:#fff;border:0;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
/* tabs: white pills, active fills with that tab's colour */
.tabbar{margin:12px 16px 6px}
.tabbar button{background:#fff;border:1px solid var(--edge);color:var(--ink)}
.tabbar button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:none}
.tabbar i{background:var(--tomato);border-color:var(--wall-1)}
/* emoji circles + soft accents pick up the tab colour */
.sticker,.row-i .emo,.ex button .sticker{background:var(--acc-soft)!important}
.sync .emo-i{background:#f1efe9}
.rc-top span:first-child{color:var(--ink)}
.rc-bar{background:#efede7}.rc-bar i{background:var(--acc)}
body[data-tab=chat] .rc-bar i{background:var(--ink)}
.gc i{background:conic-gradient(var(--tomato) var(--p),#ecebe5 0)}
.burst.all{background:var(--sun)}
.macros .mp{background:var(--blush);border-color:var(--blush)}
.bh .btag,.rhead small.made,.linkbtn{color:var(--red-t)}
.tape{background:rgba(255,200,61,.55)}
.chips2 button.sel,.week button.on{background:var(--acc)!important;border-color:var(--acc);color:var(--acc-ink)}
.chips2.gpick button.ingrp{box-shadow:inset 0 0 0 1.5px var(--acc)}
.week button.today{box-shadow:inset 0 0 0 1.5px var(--tomato)}
.daysep span{background:#ecebe5}
.flagbox.green{background:#eaf6ef}.flagbox.red{background:#ffece8}
.dots i:nth-child(1){background:var(--tomato)}.dots i:nth-child(2){background:var(--sky)}.dots i:nth-child(3){background:var(--sun)}
.banner2,.keynote{background:#fff3cf!important;border:1px solid #f3e2a8!important}
.tabbar button.on i{background:#fff;color:var(--tomato);border-color:var(--acc)}
/* header band in the tab's soft colour + breathing room above the tabs */
.topbar{background:var(--acc-soft);border-radius:0 0 28px 28px;padding-bottom:18px;transition:background .35s ease}
.tabbar{margin-top:20px}
/* win screen: black, but built from the app's own pieces */
.winscreen{position:fixed;inset:0;z-index:9999;background:#0b0a0a;color:#fff;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px));font-family:var(--f);animation:wfade .3s ease both}
.winscreen.out{animation:wfade .35s ease reverse both}
@keyframes wfade{from{opacity:0}}
.wconf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.whead{position:relative;display:flex;justify-content:space-between;align-items:flex-start}
.wbrand{font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-.05em;line-height:1;color:#fff}
.wdate{color:rgba(255,255,255,.55);font-size:13px;margin-top:5px;font-weight:500}
.wsun{width:60px;height:60px;fill:var(--sun);animation:bsun 24s linear infinite}
.wmid{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.wstar{position:relative;width:min(50vw,210px);aspect-ratio:1;animation:swoop 1.25s cubic-bezier(.2,.9,.25,1.15) both,bob 2.6s ease-in-out 1.3s infinite}
.wstar svg{width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(255,200,61,.35))}
@keyframes swoop{0%{transform:translate(-110vw,-55vh) rotate(-260deg) scale(.35)}55%{transform:translate(8vw,4vh) rotate(18deg) scale(1.08)}78%{transform:translate(-2vw,-1vh) rotate(-6deg) scale(.97)}100%{transform:none}}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.seyes{transform-origin:104px 96px;animation:blink 3.6s 1.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.wtitle{font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,system-ui,sans-serif;font-weight:800;font-size:clamp(32px,9.5vw,42px);letter-spacing:-.05em;line-height:1.02;margin:20px 0 22px;max-width:12ch;color:#fff}

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (id, cls = "") => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const idOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayId = () => idOf(new Date());
const parseId = id => { const [y, m, d] = String(id).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (id, n) => { const d = parseId(id); d.setDate(d.getDate() + Number(n || 0)); return idOf(d); };
const diffDays = (a, b) => Math.round((parseId(b) - parseId(a)) / 86400000);
const fmtDay = id => parseId(id).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
const fmtShort = id => parseId(id).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const dayName = wd => new Date(2026, 0, 4 + Number(wd)).toLocaleDateString(undefined, { weekday: "long" });
const money = n => "$" + (Number(n) || 0).toFixed(2);
const num = n => Math.round(Number(n) || 0).toLocaleString();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const normName = n => String(n || "").toLowerCase().replace(/[^a-z0-9& ]/g, " ").replace(/\s+/g, " ").trim();
const tokens = s => normName(s).split(" ").filter(w => w.length >= 3).map(w => w.replace(/(es|s)$/, ""));
function nameMatch(a, b) {
  const A = normName(a), B = normName(b);
  if (!A || !B) return false;
  if (A.includes(B) || B.includes(A)) return true;
  const ta = tokens(A), tb = tokens(B);
  return ta.some(x => tb.some(y => x === y || (x.length > 3 && y.length > 3 && (x.startsWith(y) || y.startsWith(x)))));
}

// Every meal you log becomes part of a personal library: how often, which meal of the day, which weekdays, last time, average calories.
function mealLibrary() {
  const lib = {};
  for (const id in S.days) {
    const wd = parseId(id).getDay();
    (S.days[id].meals || []).forEach(m => {
      const k = normName(m.name); if (!k) return;
      const e = lib[k] || (lib[k] = { key: k, name: m.name, count: 0, kcalSum: 0, protSum: 0, slots: {}, wd: {}, last: "" });
      e.count++; e.kcalSum += (Number(m.kcal) || 0) / (Number(m.portion) || 1); e.protSum += (Number(m.protein) || 0) / (Number(m.portion) || 1);
      const s = m.slot || "snack"; e.slots[s] = (e.slots[s] || 0) + 1; e.wd[wd] = (e.wd[wd] || 0) + 1;
      if (id >= e.last) { e.last = id; e.name = m.name; }
    });
  }
  return Object.values(lib).map(e => ({ ...e, kcal: Math.round(e.kcalSum / e.count), protein: Math.round(e.protSum / e.count) }));
}
function suggestMeals(slot = slotNow(), n = 6) {

  return mealLibrary().map(e => {
    const inSlot = e.slots[slot] || 0, share = inSlot / e.count, age = diffDays(e.last, T), onDay = e.wd[wd] || 0;
    let score = inSlot * 2 + share * 4 + onDay * 1.5 + Math.max(0, 7 - age) * 0.4;
    if (todays.has(e.key) && slot !== "snack") score -= 8;
    let why = "";
    if (onDay >= 2 && inSlot >= 2) why = `Your ${dayName(wd)} ${slot}`;
    else if (inSlot >= 3) why = `Usual ${slot}`;
    else if (age <= 1) why = age === 0 ? "Earlier today" : "Had it yesterday";
    else if (e.count >= 2) why = `${e.count}× lately`;
    return { ...e, score, why, inSlot };
  }).filter(e => e.inSlot > 0).sort((a, b) => b.score - a.score).slice(0, n);
}

function offlineAnswer(q) {
  const Q = SH.q, lq = q.toLowerCase();

    const soon = active().filter(i => daysLeft(i) <= 3).sort((a, b) => daysLeft(a) - daysLeft(b));
    Q.answer = soon.length ? `Use these first: ${soon.slice(0, 6).map(i => `${i.name} (${lifeInfo(i).short})`).join(", ")}.` : "Nothing is about to go bad. Nice.";
    SH.rec.list = basicRecipes(); Q.offline = true; return;
  }
  const words = lq.replace(/[^a-z ]/g, " ").split(/\s+/).filter(w => w.length > 2);
  const named = words.filter(w => guess(w).cat !== "other" || active().some(i => canon(i.name).includes(sing(w))));
  const want = /protein/.test(lq) ? "protein" : /breakfast/.test(lq) ? "breakfast" : /quick|fast|minute/.test(lq) ? "quick" : "";
  const act = active();
  const list = BASIC.map(r => {
    const hitsNamed = named.filter(w => r.keys.some(k => k.includes(sing(w)) || sing(w).includes(k))).length;
    const uses = act.filter(i => r.keys.some(k => i.name.toLowerCase().includes(k)));
    let score = hitsNamed * 4 + uses.reduce((s, i) => s + (daysLeft(i) <= 2 ? 3 : 1), 0);
    if (want === "protein") score += r.protein / 10; if (want === "breakfast" && r.breakfast) score += 6; if (want === "quick") score += (30 - r.minutes) / 5;
    return { ...r, useIds: uses.map(i => i.id), extra: [], score, hitsNamed };
  }).filter(r => r.score > 0 && (named.length ? r.hitsNamed > 0 || r.useIds.length : r.useIds.length)).sort((a, b) => b.score - a.score).slice(0, 4);
  SH.rec.list = list; Q.offline = true;
  Q.answer = list.length ? (named.length ? `Ideas with ${[...new Set(named)].slice(0, 4).join(", ")}${list.some(r => r.useIds.length) ? " and what's in your fridge" : ""}:` : "Here's what you can make with what you have:") : "I couldn't match that to a recipe offline. Try naming ingredients, like “I have eggs, spinach and bread”.";
}

/* ---------- grocery-app order screenshots (Instacart, Amazon Fresh, Walmart…) ---------- */
const SHOT_NOISE = /\b(DELIVERED|DELIVERY|ORDER(ED)?|REPLACED|REPLACEMENT|REFUND(ED)?|OUT OF STOCK|SUBSTITUT\w*|SUB ?TOTAL|TOTAL|TAX(ES)?|FEES?|TIP|SERVICE|CHECKOUT|CART|BUY IT AGAIN|BUY AGAIN|ADD TO|RATE|REVIEW|DETAILS|HELP|RECEIPT|VIEW|TRACK|ARRIV\w*|SHOPPER|DRIVER|PAYMENT|VISA|MASTERCARD|SAVINGS|YOU SAVED|PROMO|COUPON|MEMBERSHIP|ESTIMATED|REQUEST|CONTACT|SUPPORT|SHARE|EDIT|SEARCH|ACCOUNT|SETTINGS|CHAT|PICKED|FOUND|NOT FOUND|SPECIAL INSTRUCTIONS|ADDRESS|APT|STREET)\b/i;
const STORE_ONLY = /^(instacart|amazon( fresh)?|whole foods( market)?|walmart|target|costco|kroger|safeway|wegmans|trader joe'?s|fresh ?direct|gopuff|doordash|uber eats|stop ?& ?shop|aldi|h ?mart|patel brothers|key food|foodtown|publix|sprouts)\b.{0,20}$/i;
function cleanProduct(t) {
  let s = t.replace(/[•·▪●○✓✔☑️☐|]/g, " ").replace(/\([^)]*\)/g, " ");
  const parts = s.split(/\s*,\s*/).filter(Boolean);
  if (parts.length > 1) s = parts.find(p => guess(p).cat !== "other") || parts.sort((a, b) => b.length - a.length)[0];
  s = s.replace(/\b\d+(\.\d+)?\s*(fl\.?\s*oz|oz|lbs?|lb|ct|count|pk|pack|g|kg|ml|l|gal|qt|pt|each|ea)\b\.?/gi, " ").replace(/\b(about|approx\.?|per|each|by)\b\s*$/i, " ").replace(/\s+/g, " ").trim();
  return s;
}
function parseOrderShot(lines) {
  const L = lines.map(l => String(l || "").replace(/\s+/g, " ").trim()).filter(Boolean), rows = [];

  const PRICE_ONLY = /^(?:[~≈]?\$\s?\d{1,4}[.,]\d{2})(?:\s*(?:\/|ea|each|lb).*)?$/i, ANYPRICE = /\$\s?(\d{1,4})[.,](\d{2})/;
  for (let i = 0; i < L.length; i++) {
    let t = L[i];
    const qOnly = t.match(/^(?:qty|quantity)\s*[:.]?\s*(\d{1,2})\b|^(\d{1,2})\s*[x×]$|^[x×]\s*(\d{1,2})$/i);
    if (qOnly) { const r = rows[rows.length - 1]; if (r) r.qty = +(qOnly[1] || qOnly[2] || qOnly[3]); continue; }
    if (PRICE_ONLY.test(t)) { const r = rows[rows.length - 1], m = t.match(ANYPRICE); if (r && r.price == null && m) r.price = +(m[1] + "." + m[2]); continue; }

    if (STORE_ONLY.test(t) || (nm && (wc <= 4 || nm.index < 3)) || /\d{1,2}:\d{2}/.test(t)) continue;
    let qty = 1, price = null, m;
    if ((m = t.match(/(?:qty|quantity)\s*[:.]?\s*(\d{1,2})/i))) { qty = +m[1]; t = t.replace(m[0], " "); }
    if ((m = t.match(/^(\d{1,2})\s*[x×]\s+/i))) { qty = +m[1]; t = t.slice(m[0].length); }
    if ((m = t.match(/\s[x×]\s?(\d{1,2})\b/i))) { qty = +m[1]; t = t.replace(m[0], " "); }
    if ((m = t.match(ANYPRICE))) { price = +(m[1] + "." + m[2]); t = t.replace(/[~≈]?\$\s?\d{1,4}[.,]\d{2}.*$/, " "); }
    const name = cleanProduct(t);
    const words = name.split(/\s+/).filter(w => /[a-z]{2}/i.test(w));
    if ((name.match(/[a-z]/gi) || []).length < 3) { const r = rows[rows.length - 1]; if (r) { if (qty > 1) r.qty = qty; if (r.price == null && price != null) r.price = price; } continue; }
    if (words.length > 9) continue;
    const prevRow = rows[rows.length - 1];
    if (prevRow && lastAt === i - 1 && price == null && words.length <= 3 && prevRow.cat === "other" && !prevRow.learned) {
      // product name wrapped onto a second line, e.g. "Fage Total 2% Greek" + "Yogurt"
      const merged = buildRow(prevRow.raw + " " + name, prevRow.price); merged.qty = prevRow.qty; rows[rows.length - 1] = merged; lastAt = i; continue;
    }
    const known = guess(name).cat !== "other" || !!LRN.data.receipt[rawKey(name)];
    const nextPrice = i + 1 < L.length && (PRICE_ONLY.test(L[i + 1]) || /^(?:qty|quantity)/i.test(L[i + 1]));
    if (!known && price == null && !nextPrice) continue;
    const row = buildRow(name, price); row.qty = qty; lastAt = i;
    if (!known) { row.on = false; row.note = "Check this one"; row.init.on = false; }
    rows.push(row);
  }
  const merged = [];
  for (const r of rows) { const x = merged.find(m => m.name.toLowerCase() === r.name.toLowerCase()); if (x) { x.qty = Math.max(x.qty, r.qty); if (x.price == null) x.price = r.price; } else merged.push(r); }
  return { rows: merged, store: (L.slice(0, 8).find(l => STORE_ONLY.test(l)) || "").replace(/\s{2,}.*/, "") || "Grocery order", total: null };
}

function setScanFiles(sc, files) { (sc.urls || []).forEach(u => URL.revokeObjectURL(u)); sc.files = Array.from(files).slice(0, 12); sc.urls = sc.files.map(f => URL.createObjectURL(f)); sc.file = sc.files[0]; sc.url = sc.urls[0]; }
async function scanReadOCR() {

  sc.status = "reading"; sc.err = ""; sc.prog = 0.02; sc.stage = "Starting…"; renderSheet();
  const t0 = Date.now(), all = [], lines = []; let engine = "", store = null, total = null, shots = 0;
  try {
    for (let k = 0; k < sc.files.length; k++) {
      const f = sc.files[k], shot = /png/i.test(f.type) || /^IMG_\d+\.PNG$/i.test(f.name || "");
      const pre = sc.files.length > 1 ? `Photo ${k + 1} of ${sc.files.length}: ` : "";
      const res = await ocrImage(f, u => { if (SH?.scan !== sc) return; const p = (k + u.p) / sc.files.length; sc.stage = pre + u.stage; sc.prog = p; const b = $("#ocrBar"), st = $("#ocrStage"); if (b) b.style.width = Math.round(p * 100) + "%"; if (st) st.textContent = sc.stage; }, shot ? "shot" : "receipt");
      if (SH?.scan !== sc) return;
      engine = res.engine; lines.push(...res.lines.filter(l => String(l).trim()), "");
      let parsed = shot ? parseOrderShot(res.lines) : parseReceipt(res.lines);
      if (!parsed.rows.length) { const alt = shot ? parseReceipt(res.lines) : parseOrderShot(res.lines); if (alt.rows.length) parsed = alt; }
      if (shot) shots++; store = store || parsed.store; total = total || parsed.total;
      for (const r of parsed.rows) { const x = all.find(m => m.name.toLowerCase() === r.name.toLowerCase()); if (x) { x.qty = shot ? Math.max(x.qty, r.qty) : x.qty + r.qty; if (x.price == null) x.price = r.price; } else all.push(r); }
    }
    sc.rows = all; sc.meta = { store: shots === sc.files.length && store === "Grocery order" ? `${shots} order screenshot${shots === 1 ? "" : "s"}` : store, total, engine }; sc.lines = lines; sc.status = "done";
    track("ocrMs", Date.now() - t0);
  } catch (e) {
    console.warn(e); if (SH?.scan !== sc) return;
    sc.status = "error"; sc.err = "Couldn't read that. Try a sharper photo or screenshot, with the whole list in frame.";
  }
  renderSheet();
}

async function scanRead() {
  if (SH.scan.mode === "receipt") return scanReadOCR();
  const sc = SH.scan; if (!sc.file || !aiOn()) return;
  sc.status = "reading"; sc.err = ""; sc.ctl = new AbortController(); renderSheet();
  try {
    const res = await AI.fn.json(sc.mode === "receipt" ? receiptPrompt() : photoPrompt(), { images: [sc.file], signal: sc.ctl.signal });
    if (!SH || SH.scan !== sc) return;
    const list = (Array.isArray(res?.items) ? res.items : Array.isArray(res) ? res : []).filter(x => x && x.name);
    let rows = list.map(normRow);

    if (sc.mode === "photo") {
      const act = active(); sc.seen = []; const fresh = [];
      for (const r of rows) { const m = act.find(i => nameMatch(i.name, r.name)); if (m) sc.seen.push(m.name); else fresh.push(r); }

      sc.missing = act.filter(i => !["pantry", "freezer", "door"].includes(i.zone) && !list.some(x => nameMatch(i.name, x.name))).map(i => ({ id: i.id, name: i.name, on: false }));

  } catch (e) { if (!SH || SH.scan !== sc) return; if (e?.code === "cancelled") sc.status = "idle"; else { sc.status = "error"; sc.err = aiErr(e); } }

}

function studyMetrics() {

function deficitTarget() { const st = S.settings; if (st.goalMode === "auto") return +st.deficit || 500; if (+st.burnGoal && +st.kcal) return Math.max(250, +st.burnGoal - +st.kcal); return +st.deficit || 500; }

function fanfare() {
  const ac = audioCtx(); if (!ac) return;
  const t0 = ac.currentTime + 0.05, out = ac.createGain(); out.gain.value = 0.22; out.connect(ac.destination);
  const note = (f, t, d, type = "triangle", v = 1) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.05); };
  // rising arpeggio, a little hop, then a big bright chord with sparkles on top
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => note(f, t0 + i * 0.11, 0.35));
  note(880, t0 + 0.5, 0.18); note(987.77, t0 + 0.62, 0.18);
  [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(f => { note(f, t0 + 0.78, 1.6, "triangle", 0.7); note(f * 2, t0 + 0.78, 0.9, "sine", 0.18); });
  [2093, 2637, 3136, 2637, 3520].forEach((f, i) => note(f, t0 + 0.9 + i * 0.09, 0.25, "sine", 0.25));
}

function confettiRain(cv) {
  const ctx = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  const size = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
  size();
  const cols = ["#f4412e", "#ffc83d", "#8bd8f2", "#2443d6", "#ff98c8", "#ffffff"];
  const P = Array.from({ length: 140 }, (_, i) => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * (i < 70 ? 0.3 : 1.2), w: 6 + Math.random() * 6, h: 9 + Math.random() * 8, c: cols[i % cols.length], vy: 1.6 + Math.random() * 2.4, vx: -1 + Math.random() * 2, r: Math.random() * 6, vr: -0.15 + Math.random() * 0.3, round: Math.random() < 0.25 }));
  let alive = true, t = 0;
  (function frame() {
    if (!alive) return; t++;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) {
      p.y += p.vy; p.x += p.vx + Math.sin((t + p.r * 40) / 30) * 0.6; p.r += p.vr;
      if (p.y > innerHeight + 20) { p.y = -20; p.x = Math.random() * innerWidth; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 7); ctx.fill(); } else { ctx.scale(1, Math.cos(p.r * 2)); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore();
    }
    requestAnimationFrame(frame);
  })();
  return () => { alive = false; };
}

/* ---------- auto targets: tell it your goal, it works out calories, protein, fiber, fat and burn ----------
   All maths is done here, never guessed by the AI:
   - resting burn: Mifflin–St Jeor; daily burn = resting × 1.2 + steps above 2,500 + your planned workouts; budget earns extra for steps past your goal and workouts past your usual
   - deficit: fat loss = pace × 7,700 kcal per kg ÷ 7 (capped at 25% of burn); recomp = 20% of burn; build = +250

     fat: about 30% of calories, never under 0.8 g per kg */
const AIMS = { lose: "Lose fat", recomp: "Recomp", maintain: "Maintain", gain: "Build" };
const aim = () => S.settings.aim || null;
// A normal day for you: resting burn × 1.2 + your step goal above 2,500 + your weekly workouts spread over 7 days (~45 min strength each)
function expectedBurn() {
  if (!bodyReady()) return 0;
  const kg = body().weightKg, steps = stepGoal() || 8000, wk = +fit().weekWorkouts || 3;
  return r50(bmr() * 1.2 + Math.max(0, steps - 2500) * kcalPerStep() + wk * (5 - 1) * kg * 0.75 / 7);
}
const plannedWorkPerDay = () => bodyReady() ? (+fit().weekWorkouts || 3) * (5 - 1) * body().weightKg * 0.75 / 7 : 0;
// Extra calories you've earned today beyond the plan: steps past your step goal + workout burn past your usual daily share.
function moveBonus(T) {
  const b = burnFor(T); if (!b) return 0;
  if (b.src === "health") return Math.max(0, b.total - (+S.settings.burnGoal || expectedBurn()));
  const sg = stepGoal() || 8000, st = +actOf(T).steps || 0;
  return Math.round(Math.max(0, st - sg) * kcalPerStep() + Math.max(0, b.work - plannedWorkPerDay()));
}
const r5 = x => Math.round(x / 5) * 5, r50 = x => Math.round(x / 50) * 50;
function computePlan(a = aim()) {
  if (!a || !bodyReady()) return null;
  const b = body(), kg = b.weightKg, B = bmr();
  const burn = expectedBurn();
  const pace = +a.pace || 0.5;
  let deficit = a.type === "lose" ? Math.min(pace * 7700 / 7, burn * 0.25) : a.type === "recomp" ? burn * 0.2 : a.type === "gain" ? -250 : 0;
  deficit = r50(deficit);

  const tgt = +a.targetKg > 25 ? +a.targetKg : 0;
  const refKg = tgt && (a.type === "lose" || a.type === "recomp") ? Math.min(kg, Math.max(tgt, kg * 0.85)) : kg;
  const protein = Math.min(r5(refKg * (a.type === "maintain" ? 1.6 : 1.8)), r5(kcal * 0.4 / 4));

  if (tgt && a.type === "lose" && kg > tgt) weeks = Math.ceil((kg - tgt) / Math.max(0.1, deficit * 7 / 7700));

  const next = { burnGoal: p.burn, deficit: Math.max(0, p.deficit), kcal: p.kcal, protein: p.protein, fiber: p.fiber, fatMax: p.fatMax, goalMode: p.deficit >= 0 ? "auto" : "fixed" };
  if (Object.keys(next).every(k => st[k] === next[k])) return false;

function workoutBurnParts(T) {

/* ---------- paste a recipe link: read the page, save the recipe, log a serving ---------- */
const URL_RE = /https?:\/\/[^\s<>"']+/i;
function ldRecipe(html) {

  return null;
}
const ldText = v => !v ? "" : typeof v === "string" ? v : Array.isArray(v) ? v.map(ldText).filter(Boolean).join("\n") : v.text || v.name || (v.itemListElement ? ldText(v.itemListElement) : "");

  const n = r.nutrition || {};
  const nut = ["calories", "proteinContent", "carbohydrateContent", "fatContent", "fiberContent"].filter(k => n[k]).map(k => `${k.replace("Content", "")}: ${n[k]}`).join(", ");
  return `Name: ${ldText(r.name)}\nServes: ${ldText(r.recipeYield) || "not stated"}\nIngredients:\n${[].concat(r.recipeIngredient || []).map(x => "- " + ldText(x)).join("\n")}${nut ? `\nThe site's own nutrition per serving: ${nut}` : ""}\nSteps:\n${ldText(r.recipeInstructions).slice(0, 2500)}\nSource: ${url}`;
}
async function readPage(url, signal) {
  const get = async u => { const r = await fetch(u, { signal }); if (!r.ok) throw new Error("http " + r.status); return r.text(); };
  // 1) the page itself (works when the site allows it)  2) a free reader that returns the page as text
  try { const html = await get(url); const ld = ldRecipe(html); if (ld) return { ld, text: ldSummary(ld, url) }; const t = html.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi, " ").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); if (t.length > 400) return { text: t.slice(0, 14000) }; } catch (e) { if (e?.name === "AbortError") throw e; }
  try { const t = await get("https://r.jina.ai/" + url); if (t && t.length > 200) return { text: t.slice(0, 14000) }; } catch (e) { if (e?.name === "AbortError") throw e; }
  return null;
}

Save it in save_recipes: the recipe's name, servings from the page, every ingredient with its amount for the whole batch (convert to grams where you can, use the staple table above for those), the steps, and "source_url": "${url}". If the page gives nutrition per serving, check your totals against it and trust the page if you're unsure.
${/\b(save|just save|don't log|dont log|later|for later)\b/i.test(said) ? "Do NOT log a meal, only save it." : `Also log what I ate as a meal now: ${/\d|half|½|two|three/i.test(said) ? "the amount I said" : "1 serving"} (meals: [{"recipe": the recipe name, "servings": number, "slot": the meal I said or the current one}]).`}`;

/* ---------- branded classes (SoulCycle, Bout, Barry's…): look up what the class actually is, then log it ---------- */
// Well-known formats, used when the AI can't browse. [match, type, name, usual minutes, MET, what it is]
const STUDIOS = [
  [/soul ?cycle/i, "cycle", "SoulCycle", 45, 8.5, "45-min rhythm indoor cycling, with a light hand-weights track"],
  [/peloton/i, "cycle", "Peloton ride", 30, 8.5, "Instructor-led indoor cycling"],
  [/flywheel|cyclebar|spin class|spin\b/i, "cycle", "Spin class", 45, 8.5, "Instructor-led indoor cycling"],
  [/barry'?s/i, "hiit", "Barry's", 50, 8.0, "Treadmill sprints alternating with floor strength"],
  [/orange ?theory|\botf\b/i, "hiit", "Orangetheory", 50, 8.0, "Heart-rate zone intervals: treadmill, rower, floor"],
  [/f45/i, "hiit", "F45", 45, 8.0, "Team circuit HIIT"],
  [/rumble/i, "hiit", "Rumble boxing", 45, 7.8, "Boxing-inspired HIIT: heavy bag rounds plus floor strength"],
  [/boxing|kickbox/i, "hiit", "Boxing class", 45, 7.8, "Bag work and conditioning rounds"],
  [/solid ?core/i, "pilates", "Solidcore", 50, 4.0, "Slow, high-tension pilates on a reformer-style machine"],
  [/reformer/i, "pilates", "Reformer pilates", 50, 3.5, "Machine-based pilates"],
  [/core ?power|hot yoga|bikram/i, "yoga", "Hot yoga", 60, 3.5, "Heated vinyasa flow"],
  [/barre/i, "pilates", "Barre", 50, 3.5, "Small-range strength and isometric holds at a barre"]
];
const studioOf = name => STUDIOS.find(s => s[0].test(String(name || "")));
async function researchClasses(workouts, signal) {
  const need = workouts.filter(w => w && (w.research || w.studio));
  if (!need.length) return;
  // the AI can search the web: look each class up properly
  if (AI.via === "gemini" || AI.via === "api") {
    try {
      const res = await AI.fn.json(`Look up each of these fitness classes on the web (the studio's own site first). For each one, tell me what actually happens in the class, how long a standard class is, and pick a MET from the Compendium of Physical Activities for that format (e.g. indoor cycling class ≈ 8.5, boxing bag rounds ≈ 5.5–7.8, HIIT circuit ≈ 8, reformer pilates ≈ 3–4). Use the studio's real name.
${need.map((w, i) => `${i}. ${w.studio || w.name}${w.details ? " (" + w.details + ")" : ""}`).join("\n")}
Reply JSON: {"classes":[{"i": number, "type": one of ${JSON.stringify(WTYPES)}, "name": string, "minutes": number, "met": number, "about": "one short line on the format", "source": "short site name"}]}`, { web: true, signal });
      for (const c of res?.classes || []) {
        const w = need[+c.i]; if (!w) continue;
        if (WTYPES.includes(c.type)) w.type = c.type;
        if (c.name) w.name = String(c.name);
        if (+c.met > 1 && +c.met < 16) w.met = +c.met;
        if (!(+w.minutes > 0) || w.minutes_guessed) w.minutes = +c.minutes || w.minutes;
        w.details = [c.about, w.details].filter(Boolean).join(" · ") + (c.source ? ` · looked up on ${c.source}` : "");
        w.researched = true;
      }
    } catch (e) { if (e?.code === "cancelled") throw e; }
  }
  // anything still unknown: use the built-in list of well-known studios
  for (const w of need) {
    if (w.researched) continue;
    const s = studioOf(`${w.studio || ""} ${w.name || ""}`); if (!s) continue;
    w.type = s[1]; w.name = w.name && !/^(class|workout)$/i.test(w.name) ? w.name : s[2]; w.met = s[4];
    if (!(+w.minutes > 0) || w.minutes_guessed) w.minutes = s[3];
    w.details = [s[5], w.details].filter(Boolean).join(" · ");
  }
}
// offline: "soulcycle", "bout boxing class 45 min" with no AI key
function localClass(text) {
  const s = studioOf(text); if (!s) return null;
  const m = String(text).match(/(\d{2,3})\s*(?:min|minutes|m\b)/i);
  return { type: s[1], name: s[2], minutes: m ? +m[1] : s[3], met: s[4], details: s[5] + (m ? "" : ` · assumed a ${s[3]}-min class`) };

/* ---------- packaged & store-brand foods: real label numbers from free public databases ----------
   1) USDA FoodData Central "Branded" foods (manufacturer label data, most US store brands)
   2) Open Food Facts (crowd-sourced labels, worldwide)
   Works with any AI (or none). Only the food name goes out, nothing about you. */
const STORE_BRANDS = { target: "Good & Gather", "trader joe": "Trader Joe's", "whole foods": "365", costco: "Kirkland Signature", walmart: "Great Value", aldi: "", kroger: "Kroger", wegmans: "Wegmans", safeway: "Signature Select", "h-e-b": "H-E-B", heb: "H-E-B", publix: "Publix", "stop & shop": "Stop & Shop", "shoprite": "Bowl & Basket" };
function brandGuess(x) {
  const t = `${x.brand || ""} ${x.name || ""} ${x.store || ""}`.toLowerCase();
  for (const [k, v] of Object.entries(STORE_BRANDS)) if (t.includes(k)) return { store: k, brand: v };
  return null;
}
const qtyOf = x => { const m = String(x.amount || x.amt || "").match(/(\d+(?:\.\d+)?)|½|half/i); return !m ? 1 : /½|half/i.test(m[0]) ? 0.5 : +m[1] || 1; };
const words = s => String(s || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w.length > 2 && !["from", "the", "and", "with", "brand", "stick", "sticks", "piece", "pieces", "pack", "target", "costco", "walmart"].includes(w));
function scoreName(cand, x) { const want = words(x.name), have = words(cand); const hit = want.filter(w => have.some(h => h.startsWith(w) || w.startsWith(h))).length; return want.length ? hit / want.length : 0; }
async function usdaFind(x, signal) {
  const g = brandGuess(x), q = [x.brand && !/^(target|costco|walmart|trader)/i.test(x.brand) ? x.brand : g?.brand, x.name].filter(Boolean).join(" ");
  const r = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=DEMO_KEY&dataType=Branded&pageSize=8&query=${encodeURIComponent(q)}`, { signal });
  if (!r.ok) return null;
  const foods = (await r.json())?.foods || [];
  const nut = (f, re) => (f.foodNutrients || []).find(n => re.test(n.nutrientName) && (!/Energy/.test(n.nutrientName) || /KCAL/i.test(n.unitName)))?.value;
  const best = foods.map(f => ({ f, s: scoreName(`${f.description} ${f.brandName || ""} ${f.brandOwner || ""}`, x) + (g?.brand && new RegExp(g.brand.split(" ")[0], "i").test(`${f.brandName} ${f.brandOwner}`) ? 0.6 : 0) })).filter(o => o.s >= 0.5 && nut(o.f, /^Energy/)).sort((a, b) => b.s - a.s)[0]?.f;
  if (!best) return null;
  const per = { kcal: nut(best, /^Energy/), protein: nut(best, /^Protein/) || 0, carbs: nut(best, /^Carbohydrate/) || 0, fat: nut(best, /^Total lipid/) || 0, fiber: nut(best, /^Fiber/) || 0 };
  const sg = /^(g|grm|ml|mlt)$/i.test(best.servingSizeUnit || "") ? +best.servingSize : null;
  return { per100: per, servingG: sg, servingText: best.householdServingFullText || (sg ? `${sg} g` : ""), label: `${best.brandName || best.brandOwner || ""} ${titleCase(best.description)}`.trim(), src: "USDA FoodData Central" };
}
async function offFind(x, signal) {
  const g = brandGuess(x), q = [x.brand && !/^(target|costco|walmart|trader)/i.test(x.brand) ? x.brand : g?.brand, x.name].filter(Boolean).join(" ");
  const r = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=8&fields=product_name,brands,nutriments,serving_quantity,serving_size`, { signal });
  if (!r.ok) return null;
  const ps = (await r.json())?.products || [];
  const best = ps.map(p => ({ p, s: scoreName(`${p.product_name} ${p.brands}`, x) + (g?.brand && new RegExp(g.brand.split(" ")[0], "i").test(p.brands || "") ? 0.6 : 0) })).filter(o => o.s >= 0.5 && +o.p.nutriments?.["energy-kcal_100g"] > 0).sort((a, b) => b.s - a.s)[0]?.p;
  if (!best) return null;
  const n = best.nutriments;
  return { per100: { kcal: +n["energy-kcal_100g"], protein: +n.proteins_100g || 0, carbs: +n.carbohydrates_100g || 0, fat: +n.fat_100g || 0, fiber: +n.fiber_100g || 0 }, servingG: +best.serving_quantity || null, servingText: best.serving_size || "", label: `${(best.brands || "").split(",")[0]} ${best.product_name}`.trim(), src: "Open Food Facts" };
}
function titleCase(s) { return String(s || "").toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()); }
const needsLabel = x => x && x.name && (x.needs_lookup || x.brand || brandGuess(x) || !(+x.kcal > 0));
async function labelLookup(meals, signal) {
  const need = []; (meals || []).forEach(m => (m?.items || []).forEach(x => { if (needsLabel(x) && !(+x.grams > 0 && staple(x.name) && !x.brand)) need.push(x); }));
  await Promise.all(need.slice(0, 6).map(async x => {
    let hit = null;
    for (const find of [usdaFind, offFind]) { try { hit = await find(x, signal); } catch (e) { if (e?.name === "AbortError") throw e; } if (hit) break; }
    if (!hit) return;
    // amount: your grams if you gave them, otherwise servings × the label's serving size
    const g = +x.grams > 0 ? +x.grams : hit.servingG ? hit.servingG * qtyOf(x) : null; if (!g) return;
    const f = g / 100, p = hit.per100;
    Object.assign(x, { kcal: Math.round(p.kcal * f), protein: Math.round(p.protein * f * 10) / 10, carbs: Math.round(p.carbs * f * 10) / 10, fat: Math.round(p.fat * f * 10) / 10, fiber: Math.round(p.fiber * f * 10) / 10, grams: Math.round(g), name: x.name, brand: hit.label, amount: `${x.amount || (qtyOf(x) + " serving")}${hit.servingText && !+x.grams ? ` (${hit.servingText})` : ""} · label from ${hit.src}`, needs_lookup: false, labeled: true });
  }));
}

/* ---------- the week: fat loss follows the weekly balance, not a strict 24-hour reset ----------
   Each finished day (Mon–Sun) banks how far ahead of / behind your deficit goal it ended.
   Today's budget shifts by that bank spread over the days left, never more than ±150 kcal,
   so the week absorbs normal swings without asking you to "make up" a day with a severe one. */
const WEEK_CAP = 150;
const weekOn = () => S.settings.weekly !== false && bodyReady() && !S.settings.noNumbers;
function weekStartOf(T) { const d = parseId(T).getDay(); return addDays(T, -((d + 6) % 7)); } // Monday
function dayBalance(d) {
  const b = burnFor(d); if (!b) return null;
  const eaten = kcalOf(d), budget = baseGoalFor(d), target = deficitTarget(), net = b.total - eaten;
  // a day only counts once it looks fully logged, otherwise a forgotten dinner reads as a huge deficit
  const counted = eaten >= budget * 0.5;
  return { d, eaten, burn: b.total, budget, target, net, diff: net - target, counted, low: counted && eaten < budget - 400, under: counted && eaten < FLOOR() };
}
function weekBank(T) {
  const start = weekStartOf(T), days = [];
  for (let d = start; d < T; d = addDays(d, 1)) { const x = dayBalance(d); if (x) days.push(x); }
  const done = days.filter(x => x.counted);
  return { start, days, done, sum: done.reduce((s, x) => s + x.diff, 0), net: done.reduce((s, x) => s + x.net, 0), left: 7 - diffDays(start, T) };
}
function weekAdj(T) {
  if (!weekOn()) return 0;
  const w = weekBank(T); if (!w.done.length) return 0;
  return Math.max(-WEEK_CAP, Math.min(WEEK_CAP, Math.round(w.sum / Math.max(1, w.left) / 10) * 10));
}
function weekCard(T) {
  if (!bodyReady() || S.settings.noNumbers) return "";
  const today = todayId(), start = weekStartOf(T), days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const rows = days.map(d => d > today ? { d, future: true } : d === today ? { ...dayBalance(d), live: true } : dayBalance(d));
  const done = rows.filter(x => x && !x.future && !x.live && x.counted), sum = done.reduce((s, x) => s + x.diff, 0), net = done.reduce((s, x) => s + x.net, 0);
  const tgt = deficitTarget(), adj = weekAdj(today), max = Math.max(tgt * 2, ...done.map(x => Math.abs(x.diff)), 1);
  const bar = x => {
    const lab = esc(parseId(x.d).toLocaleDateString(undefined, { weekday: "narrow" }));
    if (x.future) return `<div class="wk-c fut"><span class="wk-b"></span><small>${lab}</small></div>`;
    if (x.live) return `<div class="wk-c live" title="Today, in progress"><span class="wk-b">${x.counted ? `<i style="height:${Math.min(50, Math.abs((x.net - tgt) / max) * 50)}%" class="${x.net >= tgt ? "up" : "dn"}"></i>` : ""}</span><small>${lab}</small></div>`;
    if (!x.counted) return `<div class="wk-c skip"><span class="wk-b"></span><small>${lab}</small></div>`;
    const h = Math.min(50, Math.abs(x.diff) / max * 50);
    return `<div class="wk-c${x.low ? " low" : ""}" title="${num(x.net)} kcal deficit"><span class="wk-b"><i class="${x.diff >= 0 ? "up" : "dn"}" style="height:${h}%"></i></span><small>${lab}</small></div>`;
  };
  const lows = done.filter(x => x.low);
  const us = (S.settings.units || "us") === "us";
  let h = `<div class="weekcard"><div class="aimtop"><b>This week</b><button class="linkbtn" data-act="wk-toggle">${weekOn() ? "Balancing on" : "Balancing off"}</button></div>`;
  if (!done.length) h += `<p class="wk-big">Your week starts banking tonight.</p><small>Each fully logged day adds how far ahead or behind your ${num(tgt)} kcal deficit goal you finished. Fat loss follows the week, not any single day.</small>`;
  else {
    h += `<p class="wk-big ${sum >= 0 ? "ok" : "over"}">${num(Math.abs(sum))} kcal ${sum >= 0 ? "ahead" : "behind"}</p>
      <small>${num(net)} kcal total deficit over ${done.length} day${done.length === 1 ? "" : "s"} (goal ${num(tgt * done.length)}) · about ${us ? (net / 3500).toFixed(2) + " lb" : (net / 7700).toFixed(2) + " kg"} of fat</small>`;
  }
  h += `<div class="wk-bars">${rows.map(bar).join("")}</div>`;
  if (weekOn() && adj) h += `<p class="wk-note">${adj > 0 ? `You're ahead, so today's budget is <b>+${adj} kcal</b>.` : `To even out the week, today's budget is <b>${adj} kcal</b>.`} Spread over the ${weekBank(today).left} days left and never more than ${WEEK_CAP} a day, so you're never asked to make up a day by eating very little.</p>`;
  h += `<button class="btn soft block" data-act="wk-report">See this week's report</button>`;
  if (lows.length) h += `<p class="wk-warn">${lows.map(x => esc(parseId(x.d).toLocaleDateString(undefined, { weekday: "long" }))).join(" and ")} ${lows.length === 1 ? "was" : "were"} 400+ kcal under budget. Very low days often swing back as hunger the next day and make protein harder to hit. Aim to land within about 150 of your budget and let the week do the balancing.</p>`;
  return h + `</div>`;
}
document.addEventListener("click", e => {
  const el = e.target.closest('[data-act="wk-toggle"]'); if (!el) return;
  S.settings = { ...S.settings, weekly: !weekOn() && S.settings.weekly === false ? true : false }; putSettings(); renderAll(); refreshSheet();
  toast(S.settings.weekly === false ? "Weekly balancing off. Every day uses its own budget." : "Weekly balancing on.");
});

/* ---------- weight goal + weekly reports ----------
   Weigh-ins are kept per day. A goal is "get to X kg by a date". The app checks it honestly:
   fat loss needs ~7,700 kcal per kg, and eating below your floor isn't an option it will plan for. */
function logWeigh(kg, T = todayId()) { editDay(T, d => { d.weight = Math.round(kg * 10) / 10; }); const a = aim(); if (a && !a.startKg) { S.settings = { ...S.settings, aim: { ...a, startKg: Math.round(kg * 10) / 10, startDay: T } }; putSettings(); } }
function weighIns(fromId) { return Object.keys(S.days || {}).filter(d => (!fromId || d >= fromId) && +S.days[d]?.weight > 0).sort().map(d => ({ d, kg: +S.days[d].weight })); }
const curKg = () => { const w = weighIns(); return w.length ? w[w.length - 1].kg : body()?.weightKg || null; };
// what it takes to reach the goal from today
function goalMath(a = aim()) {
  if (!a || !(+a.targetKg > 25) || !bodyReady()) return null;
  const now = curKg(), need = Math.round((now - a.targetKg) * 10) / 10; if (need <= 0) return { done: true, now, need: 0 };
  const burn = expectedBurn(), floor = FLOOR(), kpd = 7700 / 7;
  const weeksLeft = a.byDay ? Math.max(0.5, diffDays(todayId(), a.byDay) / 7) : null;
  const perWeek = weeksLeft ? need / weeksLeft : null, dailyDef = perWeek ? Math.round(perWeek * kpd) : null;
  // the safe pace: at most ~1% of body weight a week, and never eating under your floor without moving more
  const safePace = Math.min(0.01 * now, (burn - floor) / kpd, 1);
  const safeWeeks = Math.ceil(need / Math.max(0.1, Math.min(safePace, 0.75)));
  let verdict = "ok", extraKcal = 0;
  if (perWeek && perWeek > 0.01 * now + 0.05) verdict = "too_fast";
  else if (dailyDef && burn - dailyDef < floor) { verdict = "needs_moving"; extraKcal = Math.round(floor + dailyDef - burn); }
  const eat = dailyDef ? Math.max(floor, Math.round((burn - dailyDef) / 10) * 10) : null;
  return { now, need, burn, weeksLeft, perWeek, dailyDef, eat, safePace, safeWeeks, verdict, extraKcal, extraSteps: extraKcal ? Math.round(extraKcal / kcalPerStep() / 500) * 500 : 0 };
}
function goalLine(g) {
  if (!g) return "";
  if (g.done) return "You've reached your goal weight. 🎉";
  const us = (S.settings.units || "us") === "us", W = kg => us ? `${(kg / 0.4536).toFixed(1)} lb` : `${kg.toFixed(1)} kg`;
  if (!g.weeksLeft) return `${W(g.need)} to go. At a safe pace (~${W(g.safePace)}/week) that's about ${g.safeWeeks} weeks.`;
  if (g.verdict === "too_fast") return `${W(g.need)} in ${Math.round(g.weeksLeft)} weeks is ${W(g.perWeek)}/week, faster than the ~1% of body weight a week that's realistic for fat (the rest would be water and muscle). A safe pace gets you there in about ${g.safeWeeks} weeks.`;
  if (g.verdict === "needs_moving") return `${W(g.need)} in ${Math.round(g.weeksLeft)} weeks needs a ${num(g.dailyDef)} kcal daily deficit. Eating alone can't do that above your ${num(FLOOR())} kcal floor, so it also needs ~${num(g.extraKcal)} kcal more movement a day (≈ ${num(g.extraSteps)} extra steps or a daily class).`;
  return `${W(g.need)} in ${Math.round(g.weeksLeft)} weeks = ${W(g.perWeek)}/week: eat about ${num(g.eat)} kcal on a normal day. Doable.`;
}
/* ---- the weekly report ---- */
function weekReport(start) {
  const T = todayId(), days = Array.from({ length: 7 }, (_, i) => addDays(start, i)).filter(d => d <= T);
  const bal = days.map(dayBalance).filter(Boolean), done = bal.filter(x => x.counted);
  const tgt = deficitTarget(), pg = +S.settings.protein || 0, sg = stepGoal() || 8000, wg = +fit().weekWorkouts || 0;
  const net = done.reduce((s, x) => s + x.net, 0), fatKg = net / 7700;
  const prot = days.map(d => Math.round(proteinOf(d))), protHit = done.filter(x => proteinOf(x.d) >= pg).length;
  const full = days.filter(d => d < T || done.some(x => x.d === d)), steps = full.map(d => +actOf(d).steps || 0), stepAvg = Math.round(steps.reduce((s, x) => s + x, 0) / Math.max(1, full.length));
  const wos = days.reduce((s, d) => s + workoutsOn(d).filter(w => !w.fin).length, 0);
  const defHit = done.filter(x => x.net >= tgt).length, lows = done.filter(x => x.low);
  const ws = weighIns(start).filter(w => w.d <= days[days.length - 1]);
  const wDelta = ws.length >= 2 ? Math.round((ws[ws.length - 1].kg - ws[0].kg) * 10) / 10 : null;
  const overs = done.filter(x => x.eaten > x.budget + 150);
  const a = aim(), g = goalMath(a), startKg = a?.startKg || null, lostSoFar = startKg ? Math.round((startKg - curKg()) * 10) / 10 : null;
  // what to do better next week: the two weakest areas
  const fixes = [];
  if (done.length < days.length - 1) fixes.push([9, `Log every day. ${days.length - done.length} day${days.length - done.length === 1 ? " wasn't" : "s weren't"} fully logged, so the week's numbers are a guess.`]);
  if (pg && protHit < done.length * 0.7) fixes.push([8, `Protein hit ${protHit} of ${done.length} days (goal ${pg} g). An extra scoop of your chia yogurt base or a string cheese at snack time closes most of the gap, and it protects muscle while you're in a deficit.`]);
  if (stepAvg < sg * 0.85) fixes.push([7, `Steps averaged ${num(stepAvg)} vs your ${num(sg)} goal. A 25-minute walk most days adds about 3,000 steps (~${Math.round(3000 * kcalPerStep())} kcal).`]);
  if (wg && wos < wg) fixes.push([6, `${wos} of ${wg} workouts. Book next week's classes now so they're in your calendar.`]);
  if (overs.length >= 2) fixes.push([5, `${overs.map(x => parseId(x.d).toLocaleDateString(undefined, { weekday: "short" })).join(", ")} ran 150+ over budget. Plan those days ahead: a lighter lunch or a longer walk.`]);
  if (lows.length) fixes.push([4, `${lows.length} very low day${lows.length === 1 ? "" : "s"} (400+ under). Those tend to swing back as hunger; aim for steady days within ~150 of budget.`]);
  const wins = [];
  if (defHit >= Math.max(1, done.length - 1)) wins.push(`Hit your deficit ${defHit} of ${done.length} days`);
  if (pg && protHit >= done.length * 0.7 && done.length) wins.push(`Protein on ${protHit} days`);
  if (stepAvg >= sg) wins.push(`Averaged ${num(stepAvg)} steps`);

  return { k: "report", start, end: days[days.length - 1], partial: days.length < 7, logged: done.length, n: days.length, net, fatKg, defHit, tgt, protHit, pg, stepAvg, sg, wos, wg, wDelta, lostSoFar, goal: g ? goalLine(g) : "", target: a?.targetKg || null, need: g?.need ?? null, startKg, fixes: fixes.sort((a, b) => b[0] - a[0]).slice(0, 2).map(x => x[1]), wins: wins.slice(0, 2), weighed: ws.length > 0 };
}
function reportHtml(b) {
  const us = (S.settings.units || "us") === "us", W = kg => us ? `${(kg / 0.4536).toFixed(1)} lb` : `${kg.toFixed(1)} kg`;
  const range = `${fmtShort(b.start)} – ${fmtShort(b.end)}`;
  const pct = b.target && b.startKg && b.startKg > b.target ? Math.max(0, Math.min(100, Math.round((b.startKg - (b.startKg - (b.lostSoFar || 0))) / (b.startKg - b.target) * 100))) : null;
  const row = (ok, l, v) => `<p class="rp-row ${ok ? "ok" : "no"}"><span>${ok ? "✓" : "○"}</span><span>${l}</span><b>${v}</b></p>`;
  return `<div class="report"><div class="rp-top"><span>${b.partial ? "THIS WEEK SO FAR" : "WEEKLY REPORT"}</span><span>${esc((b.start.slice(5, 7) === b.end.slice(5, 7) ? fmtShort(b.start) + "–" + parseId(b.end).getDate() : range).toUpperCase())}</span></div>
    <p class="rp-big">${b.logged ? `≈ ${W(Math.max(0, b.fatKg))} of fat` : "Not enough logged yet"}</p>
    <small>${b.logged ? `${num(b.net)} kcal total deficit over ${b.logged} logged day${b.logged === 1 ? "" : "s"}` : "Log full days to see your week"}${b.wDelta != null ? ` · scale ${b.wDelta <= 0 ? "down" : "up"} ${W(Math.abs(b.wDelta))} (water swings ±1 kg are normal)` : ""}</small>
    ${pct != null ? `<div class="rp-goal"><div class="rp-gbar"><i style="width:${pct}%"></i></div><small>${W(Math.max(0, b.lostSoFar || 0))} of ${W(b.startKg - b.target)} lost · ${pct}%</small></div>` : ""}
    ${b.goal ? `<p class="rp-goaltxt">${esc(b.goal)}</p>` : ""}
    <div class="rp-rows">${row(b.defHit >= Math.max(1, b.logged - 1), "Deficit days", `${b.defHit}/${b.logged}`)}${b.pg ? row(b.protHit >= b.logged * 0.7, "Protein days", `${b.protHit}/${b.logged}`) : ""}${row(b.stepAvg >= b.sg, "Avg steps", num(b.stepAvg))}${b.wg ? row(b.wos >= b.wg, "Workouts", `${b.wos}/${b.wg}`) : ""}${row(b.logged >= b.n - 1, "Days logged", `${b.logged}/${b.n}`)}</div>
    ${b.wins.length ? `<p class="rp-h">Keep doing</p><p class="rp-p">${b.wins.map(esc).join(" · ")}</p>` : ""}
    ${b.fixes.length ? `<p class="rp-h">Do better next week</p>${b.fixes.map(f => `<p class="rp-p">• ${esc(f)}</p>`).join("")}` : ""}
    ${b.weighed ? "" : `<p class="rp-tip">Weigh in once a week, same morning: just tell chat “weighed 58.4 kg”.</p>`}</div>`;
}
// Monday: drop last week's report into chat once
function maybeWeekReport() {
  if (!bodyReady() || S.settings.noNumbers) return;
  const T = todayId(), last = addDays(weekStartOf(T), -7);
  if (S.settings.lastReport === last) return;
  const r = weekReport(last); S.settings = { ...S.settings, lastReport: last }; putSettings();
  if (!r.logged) return;
  pushMsg({ who: "app", text: "Your week in review.", blocks: [r] });
}
document.addEventListener("click", e => {
  const el = e.target.closest('[data-act="wk-report"]'); if (!el) return;
  closeSheet(); if (CH.tab !== "chat") { CH.tab = "chat"; }
  pushMsg({ who: "app", text: "Here's your week so far.", blocks: [weekReport(weekStartOf(todayId()))] });
});

setInterval(() => { if (!SH) renderHome(); }, 10 * 60 * 1000);
init();
</script>
